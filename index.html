<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldnef13r Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #00a8ec;
            min-height: 100vh;
            padding: 15px;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .navbar {
            background-color: #4b3ac8;
            width: 98%;
            max-width: 1200px;
            padding: 12px 25px;
            border-radius: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .menu-left {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .menu-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item.active {
            border: 2px solid #111;
            background-color: rgba(255, 255, 255, 0.2);
            color: #111;
        }

        .menu-right {
            display: flex;
            gap: 10px;
        }

        .auth-btn {
            background-color: #31219b;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 12px;
            border: 2px solid #111;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .auth-btn:hover {
            transform: scale(1.05);
        }

        .content-container {
            margin-top: 18vh;
            text-align: center;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .home-text-1 {
            color: #d96338;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .home-text-2 {
            color: #d96338;
            font-size: 1.2rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            text-align: left;
            color: #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: #111;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #4b3ac8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="navbar-container">
        <div class="navbar">
            <div class="menu-left">
                <span class="menu-item active" onclick="switchTab('home', this)">home</span>
                <span class="menu-item" onclick="switchTab('bando', this)">bán đồ cũ</span>
                <span class="menu-item" onclick="switchTab('danhsach', this)">danh sách lớp</span>
                <span class="menu-item" onclick="switchTab('vongquay', this)">vòng quay may mắn(tên)</span>
            </div>
            <div class="menu-right">
                <button class="auth-btn" onclick="openModal('registerModal')">đăng ký</button>
                <button class="auth-btn" onclick="openModal('loginModal')">đăng nhập</button>
            </div>
        </div>
    </div>

    <div class="content-container">
        <div id="home" class="tab-content active">
            <p class="home-text-1">chx có j ở đây :- (</p>
            <p class="home-text-2">hãy đăng ký hoặc đăng nhập bằng Email / Mật khẩu</p>
        </div>

        <div id="bando" class="tab-content">
            <h2>🛒 Bán đồ cũ</h2>
            <p style="margin-top: 10px;">Chợ thanh lý của lớp!</p>
        </div>

        <div id="danhsach" class="tab-content">
            <h2>📋 Danh sách lớp</h2>
            <p style="margin-top: 10px;">Danh sách thành viên...</p>
        </div>

        <div id="vongquay" class="tab-content">
            <h2>🎡 Vòng quay may mắn</h2>
            <p style="margin-top: 10px;">Quay tên ngẫu nhiên...</p>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h3 class="modal-title">Đăng Nhập</h3>
            <div class="form-group">
                <label>Gmail / Tên tài khoản</label>
                <input type="text" id="loginEmail" placeholder="Nhập Gmail...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
            </div>
            <button class="submit-btn" onclick="handleLogin()">Đăng Nhập</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG KÝ (CÓ THÊM HỌ VÀ TÊN) -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
            <h3 class="modal-title">Đăng Ký Tài Khoản</h3>
            <div class="form-group">
                <label>Họ và Tên (*)</label>
                <input type="text" id="regName" placeholder="Nhập họ và tên bạn...">
            </div>
            <div class="form-group">
                <label>Gmail (*)</label>
                <input type="email" id="regEmail" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>Mật khẩu (*)</label>
                <input type="password" id="regPass" placeholder="Tạo mật khẩu...">
            </div>
            <button class="submit-btn" onclick="sendOTP()">Gửi Mã Xác Nhận (OTP)</button>

            <div id="otpSection" style="display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <div class="form-group">
                    <label>Mã xác nhận (OTP)</label>
                    <input type="text" id="otpInput" placeholder="Nhập 6 số mã OTP...">
                </div>
                <button class="submit-btn" style="background-color: #28a745;" onclick="verifyOTP()">Xác Nhận Đăng Ký</button>
            </div>
        </div>
    </div>

    <script>
        let generatedOTP = null;
        let registeredName = "";

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function sendOTP() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if (!name) {
                alert('Vui lòng nhập Họ và Tên!');
                return;
            }
            if (!email) {
                alert('Vui lòng nhập Gmail!');
                return;
            }
            if (!pass) {
                alert('Vui lòng nhập Mật khẩu!');
                return;
            }

            registeredName = name;
            generatedOTP = Math.floor(100000 + Math.random() * 900000);
            alert(`[MÃ XÁC NHẬN OTP CỦA BẠN LÀ]: ${generatedOTP}`);
            document.getElementById('otpSection').style.display = 'block';
        }

        function verifyOTP() {
            const userOTP = document.getElementById('otpInput').value;
            if (userOTP == generatedOTP) {
                alert('Đăng ký tài khoản thành công!');
                closeModal('registerModal');
                document.querySelector('.home-text-1').innerText = `Chào mừng ${registeredName}!`;
                document.querySelector('.home-text-2').innerText = "Bạn đã đăng ký và đăng nhập thành công.";
            } else {
                alert('Mã OTP không đúng, vui lòng kiểm tra lại!');
            }
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            if (email) {
                alert('Đăng nhập thành công!');
                closeModal('loginModal');
                document.querySelector('.home-text-1').innerText = `Chào mừng ${email}!`;
                document.querySelector('.home-text-2').innerText = "Bạn đã đăng nhập thành công.";
            } else {
                alert('Vui lòng điền thông tin đăng nhập!');
            }
        }
    </script>

</body>
</html>
