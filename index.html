<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldnef13r Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #00a8ec; /* Màu nền xanh tươi chuẩn từ ảnh */
            min-height: 100vh;
            padding: 15px;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NAVBAR CONTAINER */
        .navbar-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .navbar {
            background-color: #4b3ac8; /* Màu xanh tím của menu */
            width: 98%;
            max-width: 1200px;
            padding: 12px 25px;
            border-radius: 45px; /* Bo góc cong hai đầu */
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .menu-left {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* CÁC MỤC MENU */
        .menu-item {
            color: #111;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Khi mục được chọn (Giống ô viền màu đen quanh nút Home trong ảnh) */
        .menu-item.active {
            border: 2px solid #111;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu-right {
            display: flex;
            gap: 10px;
        }

        /* NÚT ĐĂNG KÝ & ĐĂNG NHẬP */
        .auth-btn {
            background-color: #31219b;
            color: #111;
            padding: 8px 18px;
            border-radius: 12px;
            border: 2px solid #111; /* Ô viền đen bao quanh nút */
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .auth-btn:hover {
            transform: scale(1.05);
        }

        /* KHUNG NỘI DUNG Ở GIỮA TRANG */
        .content-container {
            margin-top: 15vh; /* Đẩy nội dung ra giữa màn hình */
            text-align: center;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Dòng chữ ở trang Home (giống màu cam/nâu nhẹ trong ảnh) */
        .home-text-1 {
            color: #d96338;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        .home-text-2 {
            color: #d96338;
            font-size: 1.2rem;
        }

        /* POPUP MODAL TỰ TẠO */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            color: #333;
        }

        .google-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn {
            margin-top: 15px;
            background: #ccc;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- THANH MENU NAVBAR -->
    <div class="navbar-container">
        <div class="navbar">
            <div class="menu-left">
                <span class="menu-item active" onclick="switchTab('home', this)">home</span>
                <span class="menu-item" onclick="switchTab('bando', this)">bán đồ cũ</span>
                <span class="menu-item" onclick="switchTab('danhsach', this)">danh sách lớp</span>
                <span class="menu-item" onclick="switchTab('vongquay', this)">vòng quay may mắn(tên)</span>
            </div>
            <div class="menu-right">
                <button class="auth-btn" onclick="openModal('authModal')">đăng ký</button>
                <button class="auth-btn" onclick="openModal('authModal')">đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- NỘI DUNG HIỂN THỊ CHÍNH -->
    <div class="content-container">
        
        <!-- TRANG HOME -->
        <div id="home" class="tab-content active">
            <p class="home-text-1">chx có j ở đây :-(</p>
            <p class="home-text-2">hãy đăng ký hoặc đăng nhập( có hỗ trợ google)</p>
        </div>

        <!-- TRANG BÁN ĐỒ CŨ -->
        <div id="bando" class="tab-content">
            <h2>🛒 Bán đồ cũ</h2>
            <p style="margin-top: 10px;">Chợ thanh lý của lớp!</p>
        </div>

        <!-- TRANG DANH SÁCH LỚP -->
        <div id="danhsach" class="tab-content">
            <h2>📋 Danh sách lớp</h2>
            <p style="margin-top: 10px;">Danh sách thành viên...</p>
        </div>

        <!-- TRANG VÒNG QUAY MAY MẮN -->
        <div id="vongquay" class="tab-content">
            <h2>🎡 Vòng quay may mắn</h2>
            <p style="margin-top: 10px;">Quay tên ngẫu nhiên...</p>
        </div>

    </div>

    <!-- POPUP ĐĂNG NHẬP / ĐĂNG KÝ CÓ SUPPORT GOOGLE -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h3>Đăng Nhập / Đăng Ký</h3>
            <button class="google-btn" onclick="alert('Đang kết nối tới Google Sign-In...')">
                🌐 Tiếp tục với Google
            </button>
            <br>
            <button class="close-btn" onclick="closeModal('authModal')">Đóng</button>
        </div>
    </div>

    <script>
        function switchTab(tabId, element) {
            // Ẩn tất cả tab
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // Bỏ ô viền đen ở mục menu cũ
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

            // Hiện tab được chọn + thêm ô viền đen
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>

</body>
</html>
