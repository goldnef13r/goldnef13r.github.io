<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNwebOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(135deg,#00a8ec,#4b3ac8);color:#1a1a1a;background-size:cover;background-position:center}
[hidden]{display:none!important}
button{cursor:pointer;font-weight:700}
.btn{background:#4b3ac8;color:#fff;border:0;border-radius:10px;padding:11px 16px;width:100%;margin-top:10px}
.btn.alt{background:#e8e8f4;color:#31219b}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;margin-top:6px}
label{font-size:.9rem;font-weight:700}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.card h2{color:#4b3ac8;margin-bottom:14px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:2px solid #4b3ac8;border-radius:10px;background:#fff;color:#4b3ac8}
.tabs button.on{background:#4b3ac8;color:#fff}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
.row input{width:auto;margin:0}
#msg{margin-top:10px;font-size:.9rem;min-height:1.2em;color:#c0392b}
#msg.ok{color:#1e8449}

/* OS */
#os{height:100%;position:relative}
#desk{position:absolute;inset:0 0 48px 0}
.ico{position:absolute;touch-action:none;user-select:none;width:84px;background:none;border:0;color:#fff;font-size:.8rem;text-align:center;padding:8px 4px;border-radius:10px}
.ico:hover{background:rgba(255,255,255,.18)}
.ico b{display:block;font-size:2.2rem;line-height:1.2}
#bar{z-index:9998;position:absolute;left:0;right:0;bottom:0;height:48px;background:#31219b;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px}
#tasks{flex:1;display:flex;gap:6px;overflow:auto}
#tasks button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;width:42px;height:34px;font-size:1.25rem;white-space:nowrap;flex:none}
#tasks button.on{background:rgba(255,255,255,.35)}
#tasks button.mn{opacity:.55}
#clock{font-size:.85rem;white-space:nowrap}
#start{background:#4b3ac8;color:#fff;border:0;border-radius:8px;width:40px;height:34px;font-size:1.2rem}
#menu{position:absolute;left:8px;bottom:56px;z-index:9999;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:6px;width:220px;max-height:70%;overflow:auto}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:8px;font-size:1rem;font-weight:400}
#menu button:hover{background:#eef}

/* Win */
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;width:480px;max-width:96vw;height:440px;max-height:calc(100% - 48px)}
.win header{background:#4b3ac8;color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:move;touch-action:none;user-select:none}
.win header div{display:flex;gap:6px}
.win header button{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:6px;width:30px;height:28px;font-size:1rem}
.win header .x{background:#e74c3c}
.win .body{padding:14px;overflow:auto;flex:1}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;max-height:none;max-width:none;border-radius:0}

/* Component */
.bar{height:12px;background:#e4e6eb;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#4b3ac8}
.file{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:.9rem}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file button{border:0;background:#eef;color:#31219b;border-radius:6px;padding:5px 9px}
.file button.del{background:#fdecea;color:#c0392b}
.small{font-size:.85rem;color:#666}
.msgs{height:250px;overflow:auto;background:#f4f5f9;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{align-self:flex-start;background:#e4e6eb;border-radius:12px;padding:6px 10px;max-width:80%;font-size:.95rem}
.msg.me{align-self:flex-end;background:#4b3ac8;color:#fff}
.msg small{display:block;opacity:.7;font-size:.72rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{border:1px solid #e0e0e0;border-radius:12px;padding:8px;font-size:.9rem}
.prod img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#eee}
.pr{color:#27ae60;font-weight:700}
canvas{display:block;margin:0 auto;max-width:100%}
</style>
</head>
<body>

<div id="auth">
 <div class="card">
  <h2>GNwebOS</h2>
  <div class="tabs">
   <button id="tLogin" class="on" onclick="tab('login')">Đăng nhập</button>
   <button id="tReg" onclick="tab('reg')">Đăng ký</button>
  </div>
  <div id="fLogin">
   <label>Gmail</label><input id="lEmail" type="email" autocomplete="email" placeholder="ten@gmail.com">
   <label style="display:block;margin-top:10px">Mật khẩu</label><input id="lPass" type="password" autocomplete="current-password">
   <button class="btn" onclick="doLogin()">Đăng nhập</button>
  </div>
  <div id="fReg" hidden>
   <label>Gmail</label><input id="rEmail" type="email" autocomplete="email" placeholder="ten@gmail.com">
   <button class="btn alt" onclick="sendCode()">Gửi mã xác nhận về Gmail</button>
   <div id="rStep2" hidden>
    <label style="display:block;margin-top:12px">Mã xác nhận</label><input id="rCode" inputmode="numeric" placeholder="Nhập mã">
    <label style="display:block;margin-top:10px">Mật khẩu (tối thiểu 6 ký tự)</label><input id="rPass" type="password" autocomplete="new-password">
    <button class="btn" onclick="doRegister()">Hoàn tất đăng ký</button>
   </div>
  </div>
  <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="font-weight:400">Luôn đăng nhập</label></div>
  <div id="msg"></div>
 </div>
</div>

<div id="os" hidden>
 <div id="desk"></div>
 <div id="menu" hidden></div>
 <div id="bar"><button id="start" onclick="toggleMenu()" aria-label="Menu">⊞</button><div id="tasks"></div><span id="clock"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://ayadjteeqqfynfrttvda.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0L2PzSIuDt39cAaJ8xO5DA_HaeC9IPE';
const PLANS = { free: 5, pro: 15, promax: 50 };
const GB = 1024 ** 3;
const $ = id => document.getElementById(id);
let sb, user;
const mk = st => supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: st, persistSession: true, autoRefreshToken: true } });
const store = () => $('remember').checked ? localStorage : sessionStorage;
const say = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function tab(t) {
  $('fLogin').hidden = t !== 'login';$('fReg').hidden = t !== 'reg';
  $('tLogin').className = t === 'login' ? 'on' : '';$('tReg').className = t === 'reg' ? 'on' : '';
  say('');
}

async function sendCode() {
  const email = $('rEmail').value.trim();
  if (!email) return say('Nhập Gmail trước.');
  sb = mk(store());
  say('Đang gửi mã...', true);
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if (error) return say('Không gửi được mã: ' + error.message);
  $('rStep2').hidden = false;
  say('Đã gửi mã. Kiểm tra Gmail.', true);
}
async function doRegister() {
  const email = $('rEmail').value.trim(), token = $('rCode').value.trim(), pw =$('rPass').value;
  if (pw.length < 6) return say('Mật khẩu tối thiểu 6 ký tự.');
  const v = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if (v.error) return say('Mã sai hoặc hết hạn.');
  const u = await sb.auth.updateUser({ password: pw });
  if (u.error) return say('Lỗi lưu mật khẩu: ' + u.error.message);
  enter(v.data.session);
}
async function doLogin() {
  sb = mk(store());
  const { data, error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password:$('lPass').value });
  if (error) return say('Sai Gmail hoặc mật khẩu.');
  enter(data.session);
}
async function logout() { await sb.auth.signOut(); location.reload(); }

async function enter(session) {
  user = session.user;
  $('auth').hidden = true; $('os').hidden = false;
  await loadProfile();
  applyWallpaper();
  buildDesktop();
  tick(); setInterval(tick, 30000);
  if (!me) openApp('settings');
}
(async () => {
  try {
    sb = mk(localStorage);
    const { data } = await sb.auth.getSession();
    if (data.session) enter(data.session);
  } catch (e) { say('Chưa cấu hình Supabase.'); }
})();
const tick = () => $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

const APPS = { 
  files: ['📁', 'Tệp', filesApp], 
  board: ['📢', 'Bảng tin', boardApp], 
  chat: ['💬', 'Tin nhắn', chatApp], 
  market: ['🛒', 'Chợ đồ cũ', marketApp], 
  people: ['📋', 'Danh sách lớp', peopleApp], 
  browser: ['🌐', 'Trình duyệt', browserApp], 
  wheel: ['🎡', 'Vòng quay', wheelApp], 
  settings: ['⚙️', 'Cài đặt', settingsApp] 
};
const wins = {}; let z = 10, me = null;

async function loadProfile() { 
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle(); 
  me = data; 
}
function applyWallpaper() {
  if (me?.wallpaper) document.body.style.backgroundImage = `url('${me.wallpaper}')`;
}

function buildDesktop() {
  const pos = JSON.parse(localStorage.getItem('ipos') || '{}');
  $('desk').innerHTML = '';
  Object.entries(APPS).forEach(([k, a], i) => {
    const b = document.createElement('button'); b.className = 'ico'; b.innerHTML = `<b>${a[0]}</b>${a[1]}`;
    const p = pos[k] || [12 + (i % 3) * 92, 12 + Math.floor(i / 3) * 100];
    b.style.left = p[0] + 'px'; b.style.top = p[1] + 'px';
    b.addEventListener('pointerdown', e => {
      const sx = e.clientX, sy = e.clientY, ox = b.offsetLeft, oy = b.offsetTop; let moved = false;
      const mv = ev => {
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 8) moved = true;
        if (moved) { b.style.left = Math.max(0, Math.min(innerWidth - 84, ox + ev.clientX - sx)) + 'px'; b.style.top = Math.max(0, Math.min(innerHeight - 150, oy + ev.clientY - sy)) + 'px'; }
      };
      const up = ev => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        if (moved) { pos[k] = [b.offsetLeft, b.offsetTop]; localStorage.setItem('ipos', JSON.stringify(pos)); } else if (ev.type === 'pointerup') openApp(k);
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
    $('desk').appendChild(b);
  });
}

function openApp(k) {
  closeMenu();
  if (wins[k]) return show(k);
  const a = APPS[k], w = document.createElement('div'), n = Object.keys(wins).length;
  w.className = 'win';
  w.innerHTML = `<header><span>${a[0]} ${a[1]}</span><div><button class="mn" aria-label="Thu nhỏ">–</button><button class="mx" aria-label="Phóng to">□</button><button class="x" aria-label="Đóng">×</button></div></header><div class="body"></div>`;
  $('os').appendChild(w);
  w.style.left = Math.max(0, Math.min(40 + n * 28, innerWidth - w.offsetWidth)) + 'px';
  w.style.top = Math.max(0, Math.min(24 + n * 28, innerHeight - 48 - w.offsetHeight)) + 'px';
  const t = document.createElement('button'); t.textContent = a[0]; t.title = t.ariaLabel = a[1]; $('tasks').appendChild(t);
  const o = wins[k] = { w, t, min: false };
  t.onclick = () => (o.min || !t.classList.contains('on')) ? show(k) : hide(k);
  w.querySelector('.mn').onclick = () => hide(k);
  w.querySelector('.mx').onclick = () => w.classList.toggle('max');
  w.querySelector('.x').onclick = () => { o.off && o.off(); w.remove(); t.remove(); delete wins[k]; };
  w.addEventListener('pointerdown', () => show(k));
  w.querySelector('header').addEventListener('dblclick', () => w.classList.toggle('max'));
  drag(w, w.querySelector('header'));
  show(k);
  a[2](w.querySelector('.body'));
}

function show(k) { const o = wins[k]; o.min = false; o.w.style.display = 'flex'; Object.values(wins).forEach(x => x.t.classList.remove('on')); o.w.style.zIndex = ++z; o.t.classList.add('on'); o.t.classList.remove('mn'); }
function hide(k) { const o = wins[k]; o.min = true; o.w.style.display = 'none'; o.t.classList.remove('on'); o.t.classList.add('mn'); }

function drag(w, h) {
  h.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || w.classList.contains('max')) return;
    const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
    const mv = ev => { w.style.left = Math.max(0, Math.min(innerWidth - 60, ev.clientX - dx)) + 'px'; w.style.top = Math.max(0, Math.min(innerHeight - 100, ev.clientY - dy)) + 'px'; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}

function toggleMenu() { $('menu').hidden ? openMenu() : closeMenu(); }
function openMenu() {
  const m = $('menu');
  m.innerHTML = Object.entries(APPS).map(([k, a]) => `<button onclick="openApp('${k}')">${a[0]} ${a[1]}</button>`).join('') + '<button onclick="logout()">🚪 Đăng xuất</button>';
  m.hidden = false;
}
function closeMenu() { $('menu').hidden = true; }
addEventListener('pointerdown', e => { if (!e.target.closest('#menu,#start')) closeMenu(); });

/* ---- APP 1: TỆP NÂNG CAO ---- */
const planGB = () => PLANS[(user.app_metadata || {}).plan] || PLANS.free;
const fmt = b => b > GB ? (b / GB).toFixed(2) + ' GB' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.ceil(b / 1024) + ' KB';

function filesApp(el) {
  el.innerHTML = `<div id="q"></div><div class="bar"><i id="qb"></i></div>
   <div style="display:flex;gap:6px;margin-top:8px">
     <button class="btn alt" style="margin:0" id="mkFolder">+ Tạo thư mục</button>
     <input type="file" id="up" style="display:none">
     <button class="btn" style="margin:0" id="btnUp">+ Tải tệp lên</button>
   </div>
   <div id="breadcrumb" class="small" style="margin:8px 0;font-weight:bold;cursor:pointer">📁 Gốc</div>
   <div id="fl"></div>
   <div id="viewer" hidden style="margin-top:10px;padding:8px;background:#f0f0f5;border-radius:8px;text-align:center"></div>`;
  
  let currentPath = '';
  const q = el.querySelector('#q'), qb = el.querySelector('#qb'), fl = el.querySelector('#fl'), up = el.querySelector('#up'), bc = el.querySelector('#breadcrumb'), viewer = el.querySelector('#viewer');
  const bucket = () => sb.storage.from('files');
  let used = 0;

  el.querySelector('#btnUp').onclick = () => up.click();

  async function load() {
    viewer.hidden = true; viewer.innerHTML = '';
    bc.textContent = '📁 Gốc' + (currentPath ? ' / ' + currentPath.slice(0, -1) : '');
    bc.onclick = () => { currentPath = ''; load(); };

    const { data, error } = await bucket().list(user.id + '/' + currentPath, { limit: 1000, sortBy: { column: 'name', order: 'asc' } });
    if (error) { fl.textContent = 'Lỗi tải tệp: ' + error.message; return; }

    const { data: allData } = await bucket().list(user.id, { limit: 10000 });
    used = (allData || []).reduce((s, f) => s + (f.metadata?.size || 0), 0);
    q.innerHTML = `Đã dùng <b>${fmt(used)}</b> / ${planGB()} GB`;
    qb.style.width = Math.min(100, used / (planGB() * GB) * 100) + '%';

    fl.innerHTML = data.length ? '' : '<p class="small">Thư mục trống.</p>';

    data.forEach(f => {
      if (f.name === '.emptyFolderPlaceholder') return;
      const isFolder = !f.id;
      const r = document.createElement('div'); r.className = 'file';
      const displayName = f.name;

      if (isFolder || f.id === null) {
        r.innerHTML = `<span>📁 <b>${esc(displayName)}</b></span><button class="del">Xóa</button>`;
        r.querySelector('span').onclick = () => { currentPath += displayName + '/'; load(); };
      } else {
        r.innerHTML = `<span title="${esc(displayName)}">${esc(displayName)}</span><small>${fmt(f.metadata?.size || 0)}</small><button class="vw">Xem</button><button class="ren">Đổi tên</button><button class="del">Xóa</button>`;
        
        const fullPath = user.id + '/' + currentPath + displayName;
        r.querySelector('.vw').onclick = async () => {
          const s = await bucket().createSignedUrl(fullPath, 60);
          if (!s.data) return alert('Không mở được tệp.');
          const url = s.data.signedUrl;
          viewer.hidden = false;
          if (/\.(png|jpg|jpeg|gif|webp)$/i.test(displayName)) {
            viewer.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:6px"><br><a href="${url}" target="_blank" class="small">Mở ảnh lớn</a>`;
          } else if (/\.(mp4|webm|ogg)$/i.test(displayName)) {
            viewer.innerHTML = `<video src="${url}" controls style="max-width:100%;max-height:200px;border-radius:6px"></video>`;
          } else if (/\.pdf$/i.test(displayName)) {
            viewer.innerHTML = `<iframe src="${url}" style="width:100%;height:250px;border:0"></iframe><br><a href="${url}" target="_blank" class="small">Mở toàn màn hình PDF</a>`;
          } else {
            location.href = url;
          }
        };

        r.querySelector('.ren').onclick = async () => {
          const newName = prompt('Nhập tên mới cho tệp:', displayName);
          if (!newName || newName === displayName) return;
          const newFullPath = user.id + '/' + currentPath + newName;
          const { error: moveErr } = await bucket().move(fullPath, newFullPath);
          if (moveErr) alert('Lỗi đổi tên: ' + moveErr.message);
          load();
        };
      }

      r.querySelector('.del').onclick = async () => {
        if (confirm('Xóa mục này?')) {
          await bucket().remove([user.id + '/' + currentPath + displayName]);
          load();
        }
      };
      fl.appendChild(r);
    });
  }

  el.querySelector('#mkFolder').onclick = async () => {
    const fName = prompt('Tên thư mục mới:');
    if (!fName) return;
    await bucket().upload(user.id + '/' + currentPath + fName + '/.emptyFolderPlaceholder', new Blob(['']));
    load();
  };

  up.onchange = async () => {
    for (const f of up.files) {
      if (used + f.size > planGB() * GB) { alert('Hết dung lượng!'); break; }
      const cleanName = f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^\w.\-]+/g, '_');
      await bucket().upload(user.id + '/' + currentPath + cleanName, f, { upsert: true });
      used += f.size;
    }
    up.value = ''; load();
  };
  load();
}
/* ---- APP 2: BẢNG TIN LỚP ---- */
function boardApp(el) {
  const isAdmin = me?.role === 'admin' || user.email.includes('goldnef');
  el.innerHTML = `${isAdmin ? '<button class="btn" id="btnPost" style="margin-top:0">+ Đăng thông báo mới</button>' : ''}<div id="bl" style="margin-top:10px"></div>`;
  const bl = el.querySelector('#bl');

  async function load() {
    const { data } = await sb.from('board').select('*').order('created_at', { ascending: false });
    bl.innerHTML = (data || []).map(b => `<div class="prod" style="margin-bottom:8px">
      <b style="color:#4b3ac8">${esc(b.title)}</b>
      <div style="margin:4px 0;white-space:pre-wrap">${esc(b.content)}</div>
      <small class="small">${new Date(b.created_at).toLocaleString('vi-VN')} - Bởi ${esc(b.author)}</small>
    </div>`).join('') || '<p class="small">Chưa có thông báo nào.</p>';
  }

  if (isAdmin) {
    el.querySelector('#btnPost').onclick = async () => {
      const title = prompt('Tiêu đề thông báo:');
      const content = prompt('Nội dung thông báo / thời khóa biểu:');
      if (!title || !content) return;
      await sb.from('board').insert({ title, content, author: me?.name || user.email });
      load();
    };
  }
  load();
}

/* ---- APP 3: TIN NHẮN ---- */
function chatApp(el) {
  if (!me) return el.innerHTML = '<p class="small">Vào Cài đặt, đặt tên và chọn tổ trước.</p>';
  const rooms = [['all', 'Cả lớp']]; if (me.team) rooms.push(['t' + me.team, 'Tổ ' + me.team]);
  el.innerHTML = '<div class="tabs"></div><div class="msgs"></div><div style="display:flex;gap:6px;margin-top:8px"><input placeholder="Nhập tin nhắn..." style="margin:0"><button class="btn" style="width:auto;margin:0">Gửi</button></div>';
  const rs = el.querySelector('.tabs'), ms = el.querySelector('.msgs'), mi = el.querySelector('input'); let room, ch;
  const add = m => {
    const d = document.createElement('div'); d.className = 'msg' + (m.user_id === user.id ? ' me' : '');
    const s = document.createElement('small'); s.textContent = m.name; const t = document.createElement('div'); t.textContent = m.body;
    d.append(s, t); ms.appendChild(d); ms.scrollTop = ms.scrollHeight;
  };
  async function go(r) {
    room = r; ms.innerHTML = ''; ch && sb.removeChannel(ch);
    [...rs.children].forEach(b => b.className = b.dataset.r === r ? 'on' : '');
    const { data } = await sb.from('messages').select('*').eq('room', r).order('created_at', { ascending: false }).limit(100);
    if (data) data.reverse().forEach(add);
    ch = sb.channel('chat:' + r).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + r }, p => add(p.new)).subscribe();
  }
  rs.innerHTML = rooms.map(([k, n]) => `<button data-r="${k}">${n}</button>`).join('');
  rs.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.r));
  const send = async () => {
    const body = mi.value.trim(); if (!body) return; mi.value = '';
    await sb.from('messages').insert({ room, user_id: user.id, name: me.name || user.email, body });
  };
  el.querySelector('button.btn').onclick = send;
  mi.onkeydown = e => { if (e.key === 'Enter') send(); };
  go(rooms[0][0]);
  return { off: () => ch && sb.removeChannel(ch) };
}

/* ---- APP 4: CHỢ ĐỒ CŨ ---- */
function marketApp(el) {
  if (!me) return el.innerHTML = '<p class="small">Vào Cài đặt, đặt tên trước.</p>';
  el.innerHTML = `<button class="btn" style="margin-top:0">Đăng món đồ</button><div class="grid" style="margin-top:10px"></div>`;
  const grid = el.querySelector('.grid');
  async function load() {
    const { data } = await sb.from('market').select('*').order('created_at', { ascending: false });
    grid.innerHTML = (data || []).map(p => `<div class="prod">
      <img src="${esc(p.image || '')}" alt="">
      <b>${esc(p.title)}</b>
      <div class="pr">${Number(p.price).toLocaleString()} đ</div>
      <div class="small">${esc(p.seller)}</div>
      ${p.user_id === user.id ? '<button class="del" onclick="delProd(\'' + p.id + '\')">Xóa</button>' : ''}
    </div>`).join('') || '<p class="small">Chưa có món đồ nào.</p>';
  }
  el.querySelector('button').onclick = async () => {
    const title = prompt('Tên món đồ:'), price = prompt('Giá (VNĐ):'), image = prompt('Link ảnh (hoặc để trống):');
    if (!title || !price) return;
    await sb.from('market').insert({ user_id: user.id, title, price: Number(price), image, seller: me.name || user.email });
    load();
  };
  window.delProd = async id => { if (confirm('Xóa món này?')) { await sb.from('market').delete().eq('id', id); load(); } };
  load();
}

/* ---- APP 5: DANH SÁCH LỚP ---- */
function peopleApp(el) {
  el.innerHTML = `<div class="tabs"><button class="on">Cả lớp</button><button>Tổ 1</button><button>Tổ 2</button><button>Tổ 3</button><button>Tổ 4</button></div><div id="pl"></div>`;
  const pl = el.querySelector('#pl'), tabs = el.querySelectorAll('.tabs button');

    let q = sb.from('profiles').select('*');
    if (team) q = q.eq('team', team);
    const { data } = await q;
    pl.innerHTML = (data || []).map(p => `<div class="file"><span><b>${esc(p.name || 'Chưa đặt tên')}</b><br><small>${esc(p.email)}</small></span><span>Tổ ${p.team || '?'}</span></div>`).join('') || '<p class="small">Chưa có thành viên.</p>';

  tabs.forEach((b, i) => b.onclick = () => {

/* ---- APP 7: VÒNG QUAY ---- */
function wheelApp(el) {
  el.innerHTML = `<canvas width="280" height="280"></canvas><textarea rows="4" style="margin-top:10px">Bạn A\nBạn B\nBạn C\nBạn D</textarea><button class="btn">Quay</button><p class="small" style="text-align:center;margin-top:8px"></p>`;
  const c = el.querySelector('canvas'), x = c.getContext('2d'), ta = el.querySelector('textarea'), out = el.querySelector('p');
  let rot = 0, busy = false;
  const items = () => ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  function draw() {
    const l = items(), n = l.length || 1, a = 2 * Math.PI / n;
    x.clearRect(0, 0, 280, 280);
    l.forEach((s, i) => {
      x.beginPath(); x.moveTo(140, 140); x.arc(140, 140, 128, rot + i * a, rot + (i + 1) * a); x.fillStyle = `hsl(${i * 360 / n},70%,60%)`; x.fill();
      x.save(); x.translate(140, 140); x.rotate(rot + (i + .5) * a); x.fillStyle = '#111'; x.font = '14px system-ui'; x.textAlign = 'right'; x.fillText(s.slice(0, 14), 118, 5); x.restore();
    });
    x.fillStyle = '#e74c3c'; x.beginPath(); x.moveTo(140, 18); x.lineTo(130, 0); x.lineTo(150, 0); x.fill();
  }
  ta.oninput = draw;
  el.querySelector('.btn').onclick = () => {
    const l = items(); if (busy || l.length < 2) return;
    busy = true; out.textContent = '';
    const start = rot, total = 2 * Math.PI * (5 + Math.random() * 3) + Math.random() * 2 * Math.PI, t0 = performance.now(), D = 4000;
    (function step(t) {
      const p = Math.min(1, (t - t0) / D); rot = start + total * (1 - Math.pow(1 - p, 3)); draw();
      if (p < 1) return requestAnimationFrame(step);
      const a = 2 * Math.PI / l.length, ang = ((1.5 * Math.PI - rot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      out.innerHTML = 'Kết quả: <b>' + esc(l[Math.floor(ang / a)]) + '</b>'; busy = false;
    })(t0);
  };
  draw();
}

/* ---- APP 8: CÀI ĐẶT & CÁ NHÂN HÓA ---- */
async function settingsApp(el) {
  el.innerHTML = `<label>Tên hiển thị</label><input id="pn" value="${esc(me?.name || '')}">
   <label style="display:block;margin-top:10px">Tổ (1 - 4)</label><input id="pt" type="number" min="1" max="4" value="${esc(me?.team || '')}">
   <label style="display:block;margin-top:10px">Link ảnh nền máy tính</label><input id="pw" value="${esc(me?.wallpaper || '')}" placeholder="https://example.com/anh.jpg">
   <button class="btn" id="sv">Lưu thông tin & Hình nền</button>
   <label style="display:block;margin-top:14px">Đổi mật khẩu mới</label><input type="password" id="np" placeholder="Mật khẩu mới (từ 6 ký tự)">
   <button class="btn alt" id="sp">Lưu mật khẩu</button>
   <button class="btn alt" id="lo" style="margin-top:16px">Đăng xuất</button>
   <div id="sm" style="margin-top:8px;font-size:0.9rem;color:#c0392b"></div>`;
  const sm = el.querySelector('#sm');
  el.querySelector('#sv').onclick = async () => {
    const name = el.querySelector('#pn').value.trim(); if (!name) return sm.textContent = 'Nhập tên trước.';
    const wallpaper = el.querySelector('#pw').value.trim();
    const row = { id: user.id, email: user.email, name, team: +el.querySelector('#pt').value, wallpaper };
    const { error } = await sb.from('profiles').upsert(row);
    if (error) return sm.textContent = 'Lỗi: ' + error.message;
    me = row; 
    applyWallpaper();
    sm.textContent = 'Đã lưu thông tin!';
  };
  el.querySelector('#sp').onclick = async () => {
    const { error } = await sb.auth.updateUser({ password: el.querySelector('#np').value });
    sm.textContent = error ? 'Lỗi: ' + error.message : 'Đã đổi mật khẩu.';
  };
  el.querySelector('#lo').onclick = logout;
}
