<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNwebOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(135deg,#00a8ec,#4b3ac8);color:#1a1a1a}
[hidden]{display:none!important}
button{cursor:pointer;font-weight:700}
.btn{background:#4b3ac8;color:#fff;border:0;border-radius:10px;padding:11px 16px;width:100%;margin-top:10px}
.btn.alt{background:#e8e8f4;color:#31219b}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;margin-top:6px}
label{font-size:.9rem;font-weight:700}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.card h2{color:#4b3ac8;margin-bottom:14px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:2px solid #4b3ac8;border-radius:10px;background:#fff;color:#4b3ac8}
.tabs button.on{background:#4b3ac8;color:#fff}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
.row input{width:auto;margin:0}
#msg{margin-top:10px;font-size:.9rem;min-height:1.2em;color:#c0392b}
#msg.ok{color:#1e8449}
/* OS */
#os{height:100%;position:relative}
#desk{position:absolute;inset:0 0 48px 0;padding:16px;display:flex;flex-direction:column;flex-wrap:wrap;gap:10px;align-content:flex-start}
.ico{width:84px;background:none;border:0;color:#fff;font-size:.8rem;text-align:center;padding:8px 4px;border-radius:10px}
.ico:hover{background:rgba(255,255,255,.18)}
.ico b{display:block;font-size:2.2rem;line-height:1.2}
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#31219b;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px}
#tasks{flex:1;display:flex;gap:6px;overflow:auto}
#tasks button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 12px;white-space:nowrap}
#tasks button.on{background:rgba(255,255,255,.35)}
#clock{font-size:.85rem;white-space:nowrap}
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;width:460px;max-width:100vw;height:420px;max-height:calc(100% - 48px)}
.win header{background:#4b3ac8;color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:move;touch-action:none;user-select:none}
.win header button{background:#e74c3c;color:#fff;border:0;border-radius:6px;width:26px;height:26px}
.win .body{padding:14px;overflow:auto;flex:1}
@media(max-width:600px){.win{left:0!important;top:0!important;width:100%;height:calc(100% - 48px);max-height:none;border-radius:0}}
.bar{height:12px;background:#e4e6eb;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#4b3ac8}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:.9rem}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file button{border:0;background:#eef;color:#31219b;border-radius:6px;padding:5px 9px}
.file button.del{background:#fdecea;color:#c0392b}
.small{font-size:.85rem;color:#666}
canvas{display:block;margin:0 auto;max-width:100%}
</style>
</head>
<body>

<!-- ĐĂNG NHẬP / ĐĂNG KÝ -->
<div id="auth">
 <div class="card">
  <h2>GNwebOS</h2>
  <div class="tabs">
   <button id="tLogin" class="on" onclick="tab('login')">Đăng nhập</button>
   <button id="tReg" onclick="tab('reg')">Đăng ký</button>
  </div>

  <div id="fLogin">
   <label>Gmail</label><input id="lEmail" type="email" autocomplete="email" placeholder="ten@gmail.com">
   <label style="display:block;margin-top:10px">Mật khẩu</label><input id="lPass" type="password" autocomplete="current-password">
   <button class="btn" onclick="doLogin()">Đăng nhập</button>
  </div>

  <div id="fReg" hidden>
   <label>Gmail</label><input id="rEmail" type="email" autocomplete="email" placeholder="ten@gmail.com">
   <button class="btn alt" onclick="sendCode()">Gửi mã xác nhận về Gmail</button>
   <div id="rStep2" hidden>
    <label style="display:block;margin-top:12px">Mã xác nhận (từ Gmail)</label><input id="rCode" inputmode="numeric" placeholder="Nhập mã">
    <label style="display:block;margin-top:10px">Tạo mật khẩu (tối thiểu 6 ký tự)</label><input id="rPass" type="password" autocomplete="new-password">
    <button class="btn" onclick="doRegister()">Hoàn tất đăng ký</button>
   </div>
  </div>

  <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="font-weight:400">Luôn đăng nhập trên thiết bị này</label></div>
  <div id="msg"></div>
 </div>
</div>

<!-- HỆ ĐIỀU HÀNH -->
<div id="os" hidden>
 <div id="desk"></div>
 <div id="bar"><div id="tasks"></div><span id="clock"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== ĐIỀN 2 DÒNG NÀY (xem HUONG-DAN.md) ====== */
const SUPABASE_URL = 'https://ayadjteeqqfynfrttvda.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0L2PzSIuDt39cAaJ8xO5DA_HaeC9IPE';
/* ================================================ */

const PLANS = { free: 5, pro: 15, promax: 50 }; // GB
const GB = 1024 ** 3;
const $ = id => document.getElementById(id);
let sb, user;
const mk = st => supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: st, persistSession: true, autoRefreshToken: true } });
const store = () => $('remember').checked ? localStorage : sessionStorage;
const say = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function tab(t) {
  $('fLogin').hidden = t !== 'login'; $('fReg').hidden = t !== 'reg';
  $('tLogin').className = t === 'login' ? 'on' : ''; $('tReg').className = t === 'reg' ? 'on' : '';
  say('');
}

/* ---- Đăng ký: gửi mã OTP thật về Gmail ---- */
async function sendCode() {
  const email = $('rEmail').value.trim();
  if (!email) return say('Nhập Gmail trước.');
  sb = mk(store());
  say('Đang gửi mã...', true);
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if (error) return say('Không gửi được mã: ' + error.message);
  $('rStep2').hidden = false;
  say('Đã gửi mã. Kiểm tra Gmail (cả mục Spam).', true);
}
async function doRegister() {
  const email = $('rEmail').value.trim(), token = $('rCode').value.trim(), pw = $('rPass').value;
  if (pw.length < 6) return say('Mật khẩu cần ít nhất 6 ký tự.');
  const v = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if (v.error) return say('Mã sai hoặc đã hết hạn.');
  const u = await sb.auth.updateUser({ password: pw });
  if (u.error) return say('Không lưu được mật khẩu: ' + u.error.message);
  enter(v.data.session);
}

/* ---- Đăng nhập bằng mật khẩu ---- */
async function doLogin() {
  sb = mk(store());
  const { data, error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (error) return say('Sai Gmail hoặc mật khẩu.');
  enter(data.session);
}
async function logout() { await sb.auth.signOut(); location.reload(); }

/* ---- Vào hệ thống ---- */
function enter(session) {
  user = session.user;
  $('auth').hidden = true; $('os').hidden = false;
  buildDesktop();
  tick(); setInterval(tick, 30000);
}
(async () => {
  try {
    sb = mk(localStorage);
    const { data } = await sb.auth.getSession();
    if (data.session) enter(data.session);
  } catch (e) { say('Chưa cấu hình Supabase (xem HUONG-DAN.md).'); }
})();
const tick = () => $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

/* ---- Cửa sổ ---- */
const APPS = { files: ['📁', 'Tệp của tôi', filesApp], wheel: ['🎡', 'Vòng quay', wheelApp], settings: ['⚙️', 'Cài đặt', settingsApp] };
const wins = {}; let z = 10;
function buildDesktop() {
  $('desk').innerHTML = Object.entries(APPS).map(([k, a]) => `<button class="ico" onclick="openApp('${k}')"><b>${a[0]}</b>${a[1]}</button>`).join('');
}
function openApp(k) {
  if (wins[k]) return focusWin(k);
  const a = APPS[k], w = document.createElement('div');
  w.className = 'win';
  w.style.left = (60 + Object.keys(wins).length * 30) + 'px'; w.style.top = (30 + Object.keys(wins).length * 30) + 'px';
  w.innerHTML = `<header><span>${a[0]} ${a[1]}</span><button aria-label="Đóng">×</button></header><div class="body"></div>`;
  $('os').appendChild(w);
  const t = document.createElement('button'); t.textContent = a[0] + ' ' + a[1]; t.onclick = () => focusWin(k); $('tasks').appendChild(t);
  wins[k] = { w, t };
  w.querySelector('button').onclick = () => { w.remove(); t.remove(); delete wins[k]; };
  w.addEventListener('pointerdown', () => focusWin(k));
  drag(w, w.querySelector('header'));
  focusWin(k);
  a[2](w.querySelector('.body'));
}
function focusWin(k) {
  Object.values(wins).forEach(o => o.t.className = '');
  wins[k].w.style.zIndex = ++z; wins[k].t.className = 'on';
}
function drag(w, h) {
  h.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || innerWidth <= 600) return;
    const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
    const mv = ev => { w.style.left = Math.max(0, ev.clientX - dx) + 'px'; w.style.top = Math.max(0, ev.clientY - dy) + 'px'; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}

/* ---- App: Tệp (lưu trữ đám mây) ---- */
const planGB = () => PLANS[(user.app_metadata || {}).plan] || PLANS.free;
const fmt = b => b > GB ? (b / GB).toFixed(2) + ' GB' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.ceil(b / 1024) + ' KB';
function filesApp(el) {
  el.innerHTML = `<div id="q"></div><div class="bar"><i id="qb"></i></div>
   <input type="file" id="up" multiple><div id="fl" style="margin-top:8px"></div>`;
  const q = el.querySelector('#q'), qb = el.querySelector('#qb'), fl = el.querySelector('#fl'), up = el.querySelector('#up');
  const bucket = () => sb.storage.from('files');
  let used = 0;
  async function load() {
    const { data, error } = await bucket().list(user.id, { limit: 1000, sortBy: { column: 'created_at', order: 'desc' } });
    if (error) { fl.textContent = 'Lỗi tải danh sách: ' + error.message; return; }
    used = data.reduce((s, f) => s + ((f.metadata && f.metadata.size) || 0), 0);
    q.innerHTML = `Đã dùng <b>${fmt(used)}</b> / ${planGB()} GB`;
    qb.style.width = Math.min(100, used / (planGB() * GB) * 100) + '%';
    fl.innerHTML = data.length ? '' : '<p class="small">Chưa có tệp nào. Chọn tệp ở trên để tải lên.</p>';
    data.forEach(f => {
      const r = document.createElement('div'); r.className = 'file';
      r.innerHTML = `<span title="${esc(f.name)}">${esc(f.name)}</span><small>${fmt(f.metadata.size)}</small><button>Tải</button><button class="del">Xóa</button>`;
      const [dl, del] = r.querySelectorAll('button');
      dl.onclick = async () => { const s = await bucket().createSignedUrl(user.id + '/' + f.name, 60, { download: f.name }); if (s.data) location.href = s.data.signedUrl; };
      del.onclick = async () => { if (confirm('Xóa "' + f.name + '"?')) { await bucket().remove([user.id + '/' + f.name]); load(); } };
      fl.appendChild(r);
    });
  }
  up.onchange = async () => {
    for (const f of up.files) {
      if (used + f.size > planGB() * GB) { alert('Hết dung lượng gói ' + planGB() + ' GB. Xóa bớt tệp hoặc nâng cấp gói.'); break; }
      const name = f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^\w.\-]+/g, '_');
      const { error } = await bucket().upload(user.id + '/' + name, f, { upsert: true });
      if (error) alert('Không tải lên được "' + f.name + '": ' + error.message); else used += f.size;
    }
    up.value = ''; load();
  };
  load();
}

/* ---- App: Vòng quay ---- */
function wheelApp(el) {
  el.innerHTML = `<canvas width="280" height="280"></canvas>
   <textarea rows="4" style="margin-top:10px">Bạn A\nBạn B\nBạn C\nBạn D</textarea>
   <button class="btn">Quay</button><p class="small" style="text-align:center;margin-top:8px"></p>`;
  const c = el.querySelector('canvas'), x = c.getContext('2d'), ta = el.querySelector('textarea'), out = el.querySelector('p');
  let rot = 0, busy = false;
  const items = () => ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  function draw() {
    const l = items(), n = l.length || 1, a = 2 * Math.PI / n;
    x.clearRect(0, 0, 280, 280);
    l.forEach((s, i) => {
      x.beginPath(); x.moveTo(140, 140); x.arc(140, 140, 128, rot + i * a, rot + (i + 1) * a); x.fillStyle = `hsl(${i * 360 / n},70%,60%)`; x.fill();
      x.save(); x.translate(140, 140); x.rotate(rot + (i + .5) * a); x.fillStyle = '#111'; x.font = '14px system-ui'; x.textAlign = 'right'; x.fillText(s.slice(0, 14), 118, 5); x.restore();
    });
    x.fillStyle = '#e74c3c'; x.beginPath(); x.moveTo(140, 18); x.lineTo(130, 0); x.lineTo(150, 0); x.fill();
  }
  ta.oninput = draw;
  el.querySelector('.btn').onclick = () => {
    const l = items(); if (busy || l.length < 2) return;
    busy = true; out.textContent = '';
    const start = rot, total = 2 * Math.PI * (5 + Math.random() * 3) + Math.random() * 2 * Math.PI, t0 = performance.now(), D = 4000;
    (function step(t) {
      const p = Math.min(1, (t - t0) / D); rot = start + total * (1 - Math.pow(1 - p, 3)); draw();
      if (p < 1) return requestAnimationFrame(step);
      const a = 2 * Math.PI / l.length, ang = ((1.5 * Math.PI - rot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      out.innerHTML = 'Kết quả: <b>' + esc(l[Math.floor(ang / a)]) + '</b>'; busy = false;
    })(t0);
  };
  draw();
}

/* ---- App: Cài đặt ---- */
function settingsApp(el) {
  const plan = (user.app_metadata || {}).plan || 'free';
  el.innerHTML = `<p><b>${esc(user.email)}</b></p>
   <p class="small" style="margin:4px 0 12px">Gói hiện tại: <b>${esc(plan)}</b> (${planGB()} GB)</p>
   <label>Đổi mật khẩu</label><input type="password" id="np" placeholder="Mật khẩu mới (từ 6 ký tự)">
   <button class="btn" id="sp">Lưu mật khẩu</button><p class="small" id="sm" style="margin-top:6px"></p>
   <button class="btn alt" id="lo" style="margin-top:16px">Đăng xuất</button>`;
  el.querySelector('#sp').onclick = async () => {
    const { error } = await sb.auth.updateUser({ password: el.querySelector('#np').value });
    el.querySelector('#sm').textContent = error ? 'Lỗi: ' + error.message : 'Đã đổi mật khẩu.';
  };
  el.querySelector('#lo').onclick = logout;
}
</script>
</body>
</html>
