<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#31219b">
<meta name="color-scheme" content="light only">
<title>GNwebOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖥️%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif}
:root{color-scheme:light only}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 85% 15%,#7a14d6 0,transparent 55%),radial-gradient(90% 80% at 15% 90%,#00c6f2 0,transparent 60%),radial-gradient(80% 60% at 40% 25%,#ffd7c2 0,transparent 55%),linear-gradient(135deg,#f58a3a,#b142d8 50%,#4a1fc6);color:#1a1a1a;background-size:cover;background-position:center;background-repeat:no-repeat}
[hidden]{display:none!important}
button{cursor:pointer;font-weight:700}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:#4b3ac8}
.btn{background:#4b3ac8;color:#fff;border:0;border-radius:10px;padding:11px 16px;width:100%;margin-top:10px}
.btn.alt{background:#e8e8f4;color:#31219b}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;margin-top:6px;background:#fff;color:#1a1a1a}
label{font-size:.9rem;font-weight:700}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.card h2{color:#4b3ac8;margin-bottom:14px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;padding:9px;border:2px solid #4b3ac8;border-radius:10px;background:#fff;color:#4b3ac8;white-space:nowrap}
.tabs button.on{background:#4b3ac8;color:#fff}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
.row input{width:auto;margin:0}
#msg{margin-top:10px;font-size:.9rem;min-height:1.2em;color:#c0392b}
#msg.ok{color:#1e8449}

/* OS */
#os{height:100%;position:relative;--rsv:78px}
#os.dockhide{--rsv:0px}
#desk{position:absolute;inset:0}
.ico{position:absolute;touch-action:none;user-select:none;width:84px;background:none;border:0;color:#fff;font-size:.78rem;text-align:center;padding:6px 2px;border-radius:14px;text-shadow:0 1px 3px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500}
.ico:hover{background:rgba(255,255,255,.14)}
.ico:active{background:rgba(255,255,255,.22)}
.aic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4)}
.ico .nm{line-height:1.15;max-width:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Dock nổi */
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:24px;background:rgba(24,26,36,.55);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 16px);transition:transform .3s ease}
#os.dockhide #dock{transform:translate(-50%,calc(100% + 24px))}
#tasks{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0;padding:6px 2px}
#tasks::-webkit-scrollbar{display:none}
.dk{position:relative;width:46px;height:46px;flex:none;border-radius:14px;border:0;padding:0;display:grid;place-items:center;color:#fff;transition:transform .15s;box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.dk:hover{transform:translateY(-4px) scale(1.06)}
.dk.lnch{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.dk.mn{opacity:.55}
.dk.run::after{content:'';position:absolute;bottom:-6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;opacity:.8}
.dk.on::after{width:14px;margin-left:-7px;border-radius:3px;opacity:1}
.bd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ef4444;color:#fff;font-size:.66rem;display:grid;place-items:center;padding:0 4px;border:2px solid rgba(24,26,36,.9);font-weight:700;pointer-events:none}
.ico .bd{top:2px;right:12px}
#dsep{width:1px;height:28px;background:rgba(255,255,255,.22);flex:none}
#clock{color:#fff;font-weight:700;font-size:.85rem;white-space:nowrap;padding:0 4px;text-shadow:0 1px 2px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;flex:none}
#dtog{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;z-index:9999;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(24,26,36,.88);color:#fff;display:grid;place-items:center;padding:0;transition:bottom .3s ease}
#dtog:hover{background:rgba(60,64,84,.95)}
#dtog svg{transition:transform .3s}
#os.dockhide #dtog{bottom:8px}
#os.dockhide #dtog svg{transform:rotate(180deg)}

/* Bảng ứng dụng (launcher) */
#menu{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:9999;width:440px;max-width:calc(100% - 16px);max-height:calc(100% - 110px);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:rgba(24,26,36,.8);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.45);color:#fff}
#os.dockhide #menu{bottom:20px}
#menu .srch{margin:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px}
#menu .srch::placeholder{color:rgba(255,255,255,.6)}
#menu .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:auto;min-height:0}
#menu .mi{position:relative;background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:12px;font-size:.75rem;font-weight:500;text-align:center}
#menu .mi:hover{background:rgba(255,255,255,.14)}
#menu .mf{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
#menu .mf .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#menu .mf button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:.85rem}
#menu .mf button:hover{background:#e0555a}

/* Win */
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;width:480px;max-width:100%;height:440px;max-height:calc(100% - var(--rsv,78px));min-width:300px;min-height:220px}
.rz{position:absolute;z-index:6;touch-action:none}
.rz[data-d=n]{top:0;left:12px;right:12px;height:5px;cursor:ns-resize}
.rz[data-d=s]{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz[data-d=e]{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz[data-d=w]{left:0;top:12px;bottom:12px;width:5px;cursor:ew-resize}
.rz[data-d=ne]{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.rz[data-d=nw]{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz[data-d=se]{bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize}
.rz[data-d=sw]{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.win.max .rz{display:none}
.win header{background:#4b3ac8;color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:move;touch-action:none;user-select:none}
.win header div{display:flex;gap:6px}
.win header button{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:6px;width:30px;height:28px;font-size:1rem}
.win header .x{background:#e74c3c}
.win .body{padding:14px;overflow:auto;flex:1}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--rsv,78px))!important;max-height:none;max-width:none;border-radius:0;resize:none}

/* Component */
.bar{height:12px;background:#e4e6eb;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#4b3ac8;width:0;transition:width .3s}
.file{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:.9rem;flex-wrap:wrap}
.file>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px;min-width:0}
.file button,.del{border:0;background:#eef;color:#31219b;border-radius:6px;padding:5px 9px}
.file button.del,.del{background:#fdecea;color:#c0392b}
.prod .del{margin-top:6px}
.small{font-size:.85rem;color:#666}
.msgs{height:250px;overflow:auto;background:#f4f5f9;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{align-self:flex-start;background:#e4e6eb;border-radius:12px;padding:6px 10px;max-width:80%;font-size:.95rem;word-break:break-word}
.msg.me{align-self:flex-end;background:#4b3ac8;color:#fff}
.msg small{display:block;opacity:.7;font-size:.72rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{border:1px solid #e0e0e0;border-radius:12px;padding:8px;font-size:.9rem}
.prod img,.noimg{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#eee}
.noimg{display:flex;align-items:center;justify-content:center;font-size:2rem}
.pr{color:#27ae60;font-weight:700}
canvas{display:block;margin:0 auto;max-width:100%}
pre.txt{text-align:left;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;font:13px/1.4 ui-monospace,Consolas,monospace}

/* Trình quản lý tệp kiểu Windows Explorer */
.fx{display:flex;flex-direction:column;flex:1;min-height:0;container:fxw / inline-size;outline:none;background:#fff;color:#1a1a1a;font-size:.9rem}
.fx-nav{display:flex;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#f9fbfe,#e6eef8);border-bottom:1px solid #c5d3e4}
.fxb{border:1px solid #b7c6da;background:linear-gradient(#fff,#e3ecf7);border-radius:4px;width:30px;height:28px;color:#244;font-size:.8rem;font-weight:400;flex:none}
.fxb:hover:not(:disabled){border-color:#6f9bd1;background:linear-gradient(#fff,#cfe3fa)}
.fxb:disabled{opacity:.4}
.fx-addr{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:auto;white-space:nowrap;background:#fff;border:1px solid #b7c6da;border-radius:4px;height:28px;padding:0 6px}
.fx-addr .ab{padding:2px 6px;border-radius:3px;cursor:pointer;flex:none}
.fx-addr .ab:hover{background:#dbeafc}
.fx-addr i{color:#888;font-style:normal;flex:none}
.fx-search{width:170px;margin:0;padding:4px 8px;height:28px;font-size:.85rem;flex:none}
.fx-cmd{display:flex;gap:2px;align-items:center;padding:4px 8px;background:#f3f6fb;border-bottom:1px solid #d7e0ec;flex-wrap:wrap}
.fxc{background:none;border:1px solid transparent;border-radius:4px;padding:5px 9px;font-weight:400;font-size:.85rem;color:#1a1a1a}
.fxc:hover:not(:disabled){background:linear-gradient(#f4f9ff,#d9e8fa);border-color:#9bbbe3}
.fxc:disabled{opacity:.4;cursor:default}
.fx-sep{width:1px;height:20px;background:#ccd6e3;margin:0 4px}
.fx-body{flex:1;display:flex;min-height:0}
.fx-side{width:170px;flex:none;overflow:auto;background:#f6f9fd;border-right:1px solid #d7e0ec;padding:6px;display:flex;flex-direction:column;gap:1px}
.fx-sn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:4px;padding:5px 8px;font-weight:400;font-size:.85rem;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-sn:hover{background:#e3effc;border-color:#c9dcf3}
.fx-sn.on{background:#d3e5fa;border-color:#9bbbe3}
.fx-sn.sub{padding-left:22px}
.fx-sh{font-size:.75rem;color:#667;font-weight:700;padding:8px 8px 3px}
.fx-drive{margin-top:auto;padding:8px;font-size:.78rem;color:#445}
.fx-main{flex:1;min-width:0;overflow:auto;position:relative;container:fxm / inline-size}
.fx-th,.fx-row{display:grid;grid-template-columns:minmax(120px,1fr) 130px 110px 80px;align-items:center}
.fx-th{position:sticky;top:0;background:#fff;border-bottom:1px solid #e0e6ef;color:#556;font-size:.8rem;z-index:1}
.fx-th span{padding:5px 8px;cursor:pointer;border-right:1px solid #eef1f6;user-select:none}
.fx-th span:hover{background:#eaf3fd}
.fx-row{border:1px solid transparent;border-radius:3px;cursor:default;margin:0 2px;user-select:none}
.fx-row>span{padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-row .n{display:flex;align-items:center;gap:6px}
.fx-row .n .ic{font-style:normal;font-size:1.15rem}
.fx-row .s{text-align:right}
.fx-row:hover,.fx-tile:hover{background:#eaf3fd}
.fx-row.sel,.fx-tile.sel{background:#cfe3fa;border-color:#8fb6e6}
.fx-tile.dz,.fx-row.dz,.fx-sn.dz,.ab.dz{background:#b9d6f7!important;outline:1px dashed #3a78c9}
.fx-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:8px}
.fx-tile{border:1px solid transparent;border-radius:4px;padding:6px 4px;text-align:center;cursor:default;user-select:none}
.fx-tile .th{height:64px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background-size:cover;background-position:center;border-radius:4px}
.fx-tile .nm{font-size:.78rem;margin-top:4px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fx-empty{text-align:center;color:#778;padding:40px 10px;font-size:.95rem;line-height:1.7}
.fx-status{display:flex;justify-content:space-between;gap:10px;padding:4px 10px;background:#eef3fa;border-top:1px solid #d3dcea;font-size:.78rem;color:#445;flex-wrap:wrap}
@container fxm (max-width:520px){.fx-th,.fx-row{grid-template-columns:1fr 80px}.fx-th span:nth-child(2),.fx-th span:nth-child(3),.fx-row span:nth-child(2),.fx-row span:nth-child(3){display:none}}
@container fxw (max-width:560px){.fx-side{display:none}.fx-search{width:110px}}
.fx-cm{position:fixed;z-index:25000;background:#fff;border:1px solid #b9c4d4;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:3px;min-width:170px}
.fx-cm button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:6px 12px;font-weight:400;font-size:.88rem;color:#1a1a1a}
.fx-cm button:hover{background:#d9e9fb;border-color:#a9c6ea}
.fx-cm button.dg:hover{background:#fbd9d9;border-color:#e3a3a3}
.fx-cm hr{border:0;border-top:1px solid #e0e0e0;margin:3px 0}
.fx-view{background:#fff;border-radius:10px;width:900px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);color:#1a1a1a}
.fx-vh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#f9fbfe,#e1ebf7);border-bottom:1px solid #c5d3e4}
.fx-vh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-vh button{border:1px solid #b7c6da;background:#fff;border-radius:5px;padding:5px 10px;font-weight:400;margin-left:4px;color:#1a1a1a}
.fx-vb{padding:10px;overflow:auto;text-align:center;flex:1;min-height:0;background:#f3f5f8}
.fx-vb img,.fx-vb video{max-width:100%;max-height:70vh;border-radius:4px}
.fx-vb iframe{width:100%;height:70vh;border:0;background:#fff}

/* Ứng dụng: dùng chung */
.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#7f8cff,#4b3ac8);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
.win header .wt{display:flex;align-items:center;gap:8px}
.msgs{height:auto;flex:1;min-height:120px}
.mrow{display:flex;gap:6px;align-items:flex-end;align-self:flex-start;max-width:90%}
.mrow.me{align-self:flex-end;flex-direction:row-reverse}
.mrow .msg{align-self:auto;max-width:100%}
.mimg{display:block;max-width:100%;max-height:200px;border-radius:8px;margin:3px 0;cursor:zoom-in;background:#ddd;min-height:40px}
.cin{display:flex;gap:6px;margin-top:8px;align-items:center}
.cin input{margin:0}
.cin .ib{background:#e8e8f4;border:0;border-radius:10px;width:44px;height:42px;font-size:1.1rem;flex:none}
.dmr{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.dmr:hover{background:#f0f2fa}
.dmr .t{flex:1;min-width:0}
.dmr .t b,.dmr .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmr>small{color:#888;flex:none}
.dmh{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid #eee;margin-bottom:8px}
.dmh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Bảng tin */
.bp{margin-bottom:10px;padding:12px}
.bk{display:inline-block;font-size:.75rem;background:#eef0ff;color:#4b3ac8;border-radius:20px;padding:2px 10px;margin-bottom:6px;font-weight:700}
.bp .due{color:#c0392b;font-weight:700;font-size:.85rem;margin-top:4px}

/* Ghi chú */
.nt{flex:1;display:flex;min-height:0;width:100%}
.nt-l{width:170px;flex:none;border-right:1px solid #e5e7eb;overflow:auto;padding:8px;background:#f8f9fc}
.nt-l .btn{margin:0 0 8px;padding:8px}
.nti{padding:8px;border-radius:8px;cursor:pointer;font-size:.88rem;border:1px solid transparent}
.nti:hover{background:#f0f0f5}
.nti.on{background:#fff4d6;border-color:#f3d37a}
.nti b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nti small{color:#777}
.nt-r{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0;background:#fffdf5}
.nt-r input{font-weight:700;font-size:1.1rem;margin:0;background:transparent;border:0;border-bottom:1px solid #eee;border-radius:0}
.nt-r textarea{flex:1;margin-top:8px;resize:none;border:0;background:transparent;font-size:1rem;outline:none}
.nt-s{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#888;gap:8px}
@container ntw (max-width:480px){.nt{flex-direction:column}.nt-l{width:auto;max-height:112px;border-right:0;border-bottom:1px solid #e5e7eb}}

/* Máy tính */
.calc{max-width:300px;margin:0 auto}
.cd{background:#1f2430;color:#fff;border-radius:14px;padding:12px 14px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end}
.cd small{opacity:.6;min-height:1.2em}
.cd #cv{font-size:2.2rem;font-weight:600;overflow:hidden;white-space:nowrap}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ck button{padding:14px 0;border:0;border-radius:12px;background:#eef0f6;font-size:1.15rem;font-weight:600;color:#1a1a1a}
.ck button:active{filter:brightness(.88)}
.ck .op{background:#ffb74d;color:#fff}
.ck .fn{background:#d9dce6}
.ck .eq{background:#4b3ac8;color:#fff}

/* Trò chơi */
.gm-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.95rem}
.dpad{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.dpad div{display:flex;gap:4px}
.dpad button{width:52px;height:40px;border:0;border-radius:10px;background:#e8e8f4;font-size:1rem;color:#31219b}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:10px;max-width:320px;margin:0 auto;touch-action:none}
.g48 div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:0 auto}
.mem button{aspect-ratio:1;border:0;border-radius:12px;background:linear-gradient(135deg,#7f8cff,#4b3ac8);color:#fff;font-size:1.8rem}
.mem button.up{background:#fff;border:2px solid #7f8cff}

function ask(title, fields, okText = 'Lưu') {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'modal';
    const ctl = f => {
      const at = `name="${f.name}" ${f.req ? 'required' : ''}`;
      if (f.type === 'textarea') return `<textarea ${at} rows="4" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`;
      if (f.type === 'select') return `<select ${at}>${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
      return `<input ${at} placeholder="${esc(f.ph || '')}" type="${f.type || 'text'}" value="${esc(f.value || '')}" ${f.min != null ? 'min="' + f.min + '"' : ''} ${f.accept ? 'accept="' + f.accept + '"' : ''}>`;

    const onKey = e => { if (e.key === 'Escape') done(null); };
    const done = v => { ov.remove(); removeEventListener('keydown', onKey); res(v); };
    ov.querySelector('form').onsubmit = e => { e.preventDefault(); done(Object.fromEntries(new FormData(e.target))); };
    ov.querySelector('.alt').onclick = () => done(null);
    ov.addEventListener('pointerdown', e => { if (e.target === ov) done(null); });
    addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    const f = ov.querySelector('input,textarea'); if (f) f.focus();
  });
}

function cooldown(btn, sec = 30) {
  const base = btn.dataset.t || (btn.dataset.t = btn.textContent);
  let n = sec; btn.disabled = true;
  const iv = setInterval(() => {
    if (--n <= 0) { clearInterval(iv); btn.disabled = false; btn.textContent = base; }
    else btn.textContent = base + ' (' + n + 's)';
  }, 1000);
}

/* Thu nhỏ ảnh trước khi tải lên để tiết kiệm dung lượng */
function shrinkImage(file, max = 800, q = .82) {
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return res(file);
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}
const extFor = b => b.type === 'image/gif' ? 'gif' : b.type === 'image/png' ? 'png' : b.type === 'image/webp' ? 'webp' : 'jpg';

async function putImage(bucket, file, max, q) {
  const blob = await shrinkImage(file, max, q);
  const path = user.id + '/' + rid() + '.' + extFor(blob);
  const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || 'image/jpeg' });
  if (error) throw error;
  return path;
}

function drag(w, h) {

    const mv = ev => { w.style.left = Math.max(0, Math.min(innerWidth - 60, ev.clientX - dx)) + 'px'; w.style.top = Math.max(0, Math.min(innerHeight - 60, ev.clientY - dy)) + 'px'; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });

/* Kéo giãn cửa sổ từ 4 cạnh và 4 góc, luôn giữ trong màn hình */
function resizer(w) {
  const MINW = 300, MINH = 200;
  w.querySelectorAll('.rz').forEach(h => h.addEventListener('pointerdown', e => {
    if (w.classList.contains('max')) return;
    e.preventDefault(); e.stopPropagation();
    const d = h.dataset.d, sx = e.clientX, sy = e.clientY;
    const r = { l: w.offsetLeft, t: w.offsetTop, w: w.offsetWidth, h: w.offsetHeight };
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy, bottom = innerHeight - RS();
      let l = r.l, t = r.t, wd = r.w, ht = r.h;
      if (d.includes('e')) wd = Math.min(Math.max(MINW, r.w + dx), innerWidth - r.l);
      if (d.includes('s')) ht = Math.min(Math.max(MINH, r.h + dy), Math.max(MINH, bottom - r.t));
      if (d.includes('w')) { wd = Math.max(MINW, r.w - dx); l = r.l + r.w - wd; if (l < 0) { l = 0; wd = r.l + r.w; } }
      if (d.includes('n')) { ht = Math.max(MINH, r.h - dy); t = r.t + r.h - ht; if (t < 0) { t = 0; ht = r.t + r.h; } }
      Object.assign(w.style, { left: l + 'px', top: t + 'px', width: wd + 'px', height: ht + 'px' });
    };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }));
}

const extOf = n => (n.includes('.') ? n.split('.').pop().toLowerCase() : '');

    </div>
    <div class="fx-cmd">

  const root = el.querySelector('.fx'), qs = s => el.querySelector(s);

  const bk = qs('#bk'), fw = qs('#fw'), upb = qs('#upd'), bView = qs('#cView');
  const bucket = () => sb.storage.from('files');
  const coarse = matchMedia('(pointer:coarse)').matches;
  let cur = '', items = [], sel = new Set(), anchor = null, hist = [''], hi = 0, q = '', tok = 0, used = 0, folders = [], cm = null;

  /* ---- thao tác với kho lưu trữ ---- */
  async function walk(prefix, out = [], depth = 0) {
    if (depth > 8) return out;
    const { data, error } = await bucket().list(prefix, { limit: 1000 });
    if (error) throw error;
    for (const f of data || []) {
      if (f.id === null) await walk(prefix + '/' + f.name, out, depth + 1);
      else out.push({ path: prefix + '/' + f.name, size: f.metadata?.size || 0 });
    }
    return out;
  }
  async function removeAll(paths) {
    for (let i = 0; i < paths.length; i += 100) {
      const { error } = await bucket().remove(paths.slice(i, i + 100));
      if (error) throw error;
    }
  }
  async function moveTree(src, dst) {   // src, dst không có dấu / ở cuối
    const all = await walk(src);
    for (const f of all) {
      const { error } = await bucket().move(f.path, dst + f.path.slice(src.length));
      if (error) throw error;
    }
  }
  async function download(path, name) {
    const s = await bucket().createSignedUrl(path, 60, { download: name });
    if (!s.data) return toast('Không tải được tệp.', true);
    const a = document.createElement('a'); a.href = s.data.signedUrl; a.download = name;

      size: (a, b) => a.size - b.size
    }[sortK];
    return items.filter(i => !k || i.name.toLowerCase().includes(k))
      .sort((a, b) => a.folder === b.folder ? sortD * cmp(a, b) : (a.folder ? -1 : 1));
  };

      <button class="fx-sn ${cur === '' ? 'on' : ''}" data-p="" data-drop="">🖥️ Tệp của tôi</button>
      ${folders.map(n => `<button class="fx-sn sub ${cur.startsWith(n + '/') ? 'on' : ''}" data-p="${esc(n + '/')}" data-drop="${esc(n + '/')}">📁 ${esc(n)}</button>`).join('')}
      <div class="fx-drive" id="drive"></div>`;
    paintDrive();

  function paintStatus() {
    const vis = visible(), chosen = items.filter(i => sel.has(i.name));
    const sz = chosen.filter(i => !i.folder).reduce((s, i) => s + i.size, 0);
    stat.innerHTML = `<span>${vis.length} mục${chosen.length ? ' · Đã chọn ' + chosen.length + ' mục' + (sz ? ' (' + fmt(sz) + ')' : '') : ''}</span><span>Đã dùng ${fmt(used)} / ${planGB()} GB</span>`;
  }
  function paintSel() {
    main.querySelectorAll('[data-n]').forEach(x => x.classList.toggle('sel', sel.has(x.dataset.n)));
    const n = sel.size;
    qs('#cOpen').disabled = n !== 1; qs('#cRen').disabled = n !== 1; qs('#cDl').disabled = !n; qs('#cDel').disabled = !n;
    paintStatus();
  }
  async function thumbs(list, t) {
    const imgs = list.filter(i => !i.folder && /^(png|jpe?g|gif|webp|bmp)$/.test(extOf(i.name))).slice(0, 60);
    if (!imgs.length) return;
    const { data } = await bucket().createSignedUrls(imgs.map(i => base() + i.name), 600);
    if (t !== tok || !data) return;
    const tiles = [...main.querySelectorAll('.fx-tile')];
    data.forEach(d => {
      if (!d.signedUrl) return;
      const n = d.path.split('/').pop(), tile = tiles.find(x => x.dataset.n === n);
      const th = tile && tile.querySelector('.th');
      if (th) { th.style.backgroundImage = `url("${d.signedUrl}")`; th.textContent = ''; }
    });
  }
  function render() {
    const vis = visible(), t = ++tok;
    nav(); renderAddr();
    bView.textContent = view === 'details' ? '☰ Chi tiết' : '▦ Biểu tượng';
    if (!vis.length) {
      main.innerHTML = `<div class="fx-empty">📂<br>${q ? 'Không tìm thấy mục nào.' : 'Thư mục này trống.'}<br><small>${q ? '' : 'Kéo thả tệp vào đây hoặc bấm “Tải lên”.'}</small></div>`;
      paintSel(); return;
    }
    const arrow = k => sortK === k ? (sortD > 0 ? ' ▲' : ' ▼') : '';
    const drop = i => i.folder ? ` data-drop="${esc(cur + i.name + '/')}"` : '';
    if (view === 'details') {
      main.innerHTML = `<div class="fx-th"><span data-s="name">Tên${arrow('name')}</span><span data-s="date">Ngày sửa đổi${arrow('date')}</span><span data-s="type">Loại${arrow('type')}</span><span data-s="size" style="text-align:right">Kích thước${arrow('size')}</span></div>` +
        vis.map(i => `<div class="fx-row" draggable="true" data-n="${esc(i.name)}"${drop(i)}><span class="n"><i class="ic">${i.ic}</i>${esc(i.name)}</span><span>${esc(fdate(i.date))}</span><span>${esc(i.lb)}</span><span class="s">${i.folder ? '' : fmt(i.size)}</span></div>`).join('');
    } else {
      main.innerHTML = '<div class="fx-tiles">' + vis.map(i => `<div class="fx-tile" draggable="true" data-n="${esc(i.name)}"${drop(i)} title="${esc(i.name)}"><div class="th">${i.ic}</div><div class="nm">${esc(i.name)}</div></div>`).join('') + '</div>';
      thumbs(vis, t);
    }
    paintSel();
  }
  async function updateQuota() {
    try { used = (await walk(user.id)).reduce((s, f) => s + f.size, 0); } catch (e) {}
    paintDrive();
  }
  async function loadSide() {
    const { data } = await bucket().list(user.id, { limit: 1000 });
    folders = (data || []).filter(f => f.id === null).map(f => f.name).sort((a, b) => a.localeCompare(b, 'vi'));
    paintSide();
  }
  async function load(full) {
    nav(); renderAddr();
    main.innerHTML = '<p class="small" style="padding:14px">Đang tải...</p>';
    const { data, error } = await bucket().list(base().replace(/\/$/, ''), { limit: 1000 });
    if (error) { main.innerHTML = `<p class="small" style="padding:14px">Lỗi tải tệp: ${esc(error.message)}</p>`; return; }
    items = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder').map(f => {
      const folder = f.id === null;
      return { name: f.name, folder, size: f.metadata?.size || 0, date: f.updated_at || f.created_at || '', ...(folder ? { ic: '📁', lb: 'Thư mục' } : ftype(f.name)) };
    });
    render(); paintSide();
    if (full) { loadSide(); updateQuota(); }
  }
  function go(path, push = true) {
    if (push) { hist = hist.slice(0, hi + 1); hist.push(path); hi = hist.length - 1; }
    cur = path; sel.clear(); anchor = null; q = ''; srch.value = '';
    load();
  }

  /* ---- xem trước tệp ---- */
  async function openViewer(n) {
    const list = visible().filter(i => !i.folder && previewable(i.name)).map(i => i.name);
    let idx = list.indexOf(n);
    if (idx < 0) return download(base() + n, n);
    const ov = document.createElement('div'); ov.className = 'modal';
    ov.innerHTML = `<div class="fx-view"><div class="fx-vh"><b></b><span><button data-a="prev">◀</button><button data-a="next">▶</button><button data-a="dl">⬇ Tải xuống</button><button data-a="x">✕</button></span></div><div class="fx-vb"></div></div>`;
    const title = ov.querySelector('b'), body = ov.querySelector('.fx-vb');
    const onKey = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); };
    const close = () => { ov.remove(); removeEventListener('keydown', onKey); };
    async function show() {
      const name = list[idx]; title.textContent = name; body.innerHTML = '<p class="small">Đang tải...</p>';
      const s = await bucket().createSignedUrl(base() + name, 300);
      if (list[idx] !== name) return;
      if (!s.data) { body.textContent = 'Không mở được tệp.'; return; }
      const url = s.data.signedUrl, e = extOf(name);
      if (IMG_RE.test(e)) body.innerHTML = `<img src="${url}" alt="">`;
      else if (VID_RE.test(e)) body.innerHTML = `<video src="${url}" controls autoplay></video>`;
      else if (AUD_RE.test(e)) body.innerHTML = `<audio src="${url}" controls autoplay style="width:100%"></audio>`;
      else if (e === 'pdf') body.innerHTML = `<iframe src="${url}"></iframe>`;
      else {
        try {
          const t = await (await fetch(url)).text();
          if (list[idx] !== name) return;
          body.innerHTML = `<pre class="txt" style="max-height:70vh;background:#fff;padding:10px;border-radius:4px">${esc(t.slice(0, 50000))}${t.length > 50000 ? '\n… (đã cắt bớt)' : ''}</pre>`;
        } catch (err) { body.textContent = 'Không đọc được nội dung tệp.'; }
      }
    }
    const step = d => { idx = (idx + d + list.length) % list.length; show(); };
    ov.addEventListener('click', e => {
      if (e.target === ov) return close();
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'x') close(); else if (a === 'dl') download(base() + list[idx], list[idx]); else step(a === 'prev' ? -1 : 1);
    });
    addEventListener('keydown', onKey);
    document.body.appendChild(ov); show();
  }
  function openItem(n) {
    const it = items.find(i => i.name === n); if (!it) return;
    if (it.folder) go(cur + n + '/');
    else if (previewable(n)) openViewer(n);
    else download(base() + n, n);
  }

  /* ---- các lệnh: tạo, đổi tên, xóa, tải lên, di chuyển ---- */
  async function newFolder() {
    const v = await ask('Thư mục mới', [{ name: 'n', label: 'Tên thư mục', req: 1 }], 'Tạo');
    if (!v) return;
    const n = cleanName(v.n.trim()).replace(/^\.+/, '');
    if (!n) return toast('Tên thư mục không hợp lệ.', true);
    if (items.some(i => i.name === n)) return toast('Đã có mục trùng tên.', true);
    const { error } = await bucket().upload(base() + n + '/.emptyFolderPlaceholder', new Blob(['']), { upsert: true });
    if (error) toast('Lỗi tạo thư mục: ' + error.message, true);
    load(true);
  }
  async function rename(n) {
    const it = items.find(i => i.name === n); if (!it) return;
    const v = await ask(it.folder ? 'Đổi tên thư mục' : 'Đổi tên tệp', [{ name: 'n', label: 'Tên mới', value: n, req: 1 }]);
    if (!v) return;
    const nn = cleanName(v.n.trim()).replace(/^\.+/, '');
    if (!nn || nn === n) return;
    if (items.some(i => i.name === nn)) return toast('Đã có mục trùng tên.', true);
    stat.textContent = 'Đang đổi tên...';
    try {
      if (it.folder) await moveTree(base() + n, base() + nn);
      else { const { error } = await bucket().move(base() + n, base() + nn); if (error) throw error; }
      toast('Đã đổi tên.');
    } catch (e) { toast('Lỗi đổi tên: ' + e.message, true); }
    sel.clear(); load(true);
  }
  async function removeSel(names) {
    const lbl = names.length === 1 ? `"${names[0]}"` : names.length + ' mục đã chọn';
    if (!confirm(`Xóa ${lbl}? Hành động này không thể hoàn tác.`)) return;
    stat.textContent = 'Đang xóa...';
    try {
      const paths = [];
      for (const n of names) {
        const it = items.find(i => i.name === n); if (!it) continue;
        if (it.folder) (await walk(base() + n)).forEach(f => paths.push(f.path)); else paths.push(base() + n);
      }
      await removeAll(paths); toast('Đã xóa.');
    } catch (e) { toast('Lỗi xóa: ' + e.message, true); }
    sel.clear(); load(true);
  }
  async function uploadFiles(files, dir = base()) {
    let ok = 0;
    for (const f of files) {
      if (used + f.size > planGB() * GB) { toast('Hết dung lượng!', true); break; }
      stat.textContent = `Đang tải lên: ${f.name} (${ok + 1}/${files.length})`;
      const { error } = await bucket().upload(dir + cleanName(f.name), f, { upsert: true });
      if (error) toast('Lỗi tải ' + f.name + ': ' + error.message, true); else { used += f.size; ok++; }
    }
    if (ok) toast('Đã tải lên ' + ok + ' tệp.');
    load(true);
  }
  async function moveItems(names, destDir) {
    if (destDir === cur) return;
    stat.textContent = 'Đang di chuyển...';
    try {
      for (const n of names) {
        const it = items.find(i => i.name === n); if (!it) continue;
        if (it.folder) {
          if (destDir === cur + n + '/' || destDir.startsWith(cur + n + '/')) { toast('Không thể di chuyển thư mục vào chính nó.', true); continue; }
          await moveTree(base() + n, user.id + '/' + destDir + n);
        } else {
          const { error } = await bucket().move(base() + n, user.id + '/' + destDir + n);
          if (error) throw error;
        }
      }
      toast('Đã di chuyển.');
    } catch (e) { toast('Lỗi di chuyển: ' + e.message, true); }
    sel.clear(); load(true);
  }
  async function act(id) {
    if (id === 'newf') return newFolder();
    if (id === 'upl') return upInput.click();
    if (id === 'refresh') return load(true);
    const names = [...sel]; if (!names.length) return;
    if (id === 'open') return openItem(names[0]);
    if (id === 'ren') return rename(names[0]);
    if (id === 'del') return removeSel(names);
    if (id === 'dl') {
      const files = names.filter(n => items.find(i => i.name === n && !i.folder));
      if (!files.length) return toast('Chỉ tải xuống được tệp, không tải được thư mục.', true);
      for (const n of files) { await download(base() + n, n); if (files.length > 1) await sleep(500); }
    }
  }

  /* ---- menu chuột phải ---- */
  function closeCm() { if (cm) { cm.remove(); cm = null; } }
  function menu(x, y, entries) {
    closeCm();
    cm = document.createElement('div'); cm.className = 'fx-cm';
    cm.innerHTML = entries.map(([id, l, dg]) => id === '-' ? '<hr>' : `<button data-id="${id}"${dg ? ' class="dg"' : ''}>${l}</button>`).join('');
    document.body.appendChild(cm);
    cm.style.left = Math.max(0, Math.min(x, innerWidth - cm.offsetWidth - 4)) + 'px';
    cm.style.top = Math.max(0, Math.min(y, innerHeight - cm.offsetHeight - 4)) + 'px';
    cm.onclick = e => { const b = e.target.closest('button'); if (!b) return; closeCm(); act(b.dataset.id); };
    const off = e => { if (!cm || !cm.contains(e.target)) { closeCm(); removeEventListener('pointerdown', off, true); } };
    addEventListener('pointerdown', off, true);
  }

  /* ---- sự kiện ---- */
  main.addEventListener('click', e => {
    root.focus({ preventScroll: true });
    const th = e.target.closest('[data-s]');
    if (th) { const k = th.dataset.s; if (sortK === k) sortD = -sortD; else { sortK = k; sortD = 1; } render(); return; }
    const r = e.target.closest('[data-n]');
    if (!r) { sel.clear(); anchor = null; paintSel(); return; }
    const n = r.dataset.n, list = visible().map(i => i.name);
    if (e.shiftKey && anchor && list.includes(anchor)) {
      const a = list.indexOf(anchor), b = list.indexOf(n);
      sel = new Set(list.slice(Math.min(a, b), Math.max(a, b) + 1));
    } else if (e.ctrlKey || e.metaKey) { if (sel.has(n)) sel.delete(n); else sel.add(n); anchor = n; }
    else { sel = new Set([n]); anchor = n; }
    paintSel();
    if (coarse && !e.shiftKey && !e.ctrlKey) { const it = items.find(i => i.name === n); if (it && it.folder) openItem(n); }
  });
  main.addEventListener('dblclick', e => { const r = e.target.closest('[data-n]'); if (r) openItem(r.dataset.n); });
  main.addEventListener('contextmenu', e => {
    e.preventDefault();
    const r = e.target.closest('[data-n]');
    if (r) {
      const n = r.dataset.n;
      if (!sel.has(n)) { sel = new Set([n]); anchor = n; paintSel(); }
      const it = items.find(i => i.name === n);
      menu(e.clientX, e.clientY, [['open', '📂 Mở'], ...(it && !it.folder ? [['dl', '⬇️ Tải xuống']] : []), ['ren', '✏️ Đổi tên'], ['-'], ['del', '🗑️ Xóa', 1]]);
    } else {
      sel.clear(); paintSel();
      menu(e.clientX, e.clientY, [['newf', '📁 Thư mục mới'], ['upl', '⬆️ Tải tệp lên'], ['-'], ['refresh', '🔄 Làm mới']]);
    }
  });
  root.addEventListener('click', e => { const p = e.target.closest('[data-p]'); if (p) go(p.dataset.p); });
  bk.onclick = () => { if (hi > 0) { hi--; go(hist[hi], false); } };
  fw.onclick = () => { if (hi < hist.length - 1) { hi++; go(hist[hi], false); } };
  upb.onclick = () => { if (cur) go(parent()); };
  qs('#cNew').onclick = newFolder;
  qs('#cUp').onclick = () => upInput.click();
  qs('#cOpen').onclick = () => act('open');
  qs('#cDl').onclick = () => act('dl');
  qs('#cRen').onclick = () => act('ren');
  qs('#cDel').onclick = () => act('del');
  bView.onclick = () => { view = view === 'details' ? 'tiles' : 'details'; localStorage.setItem('fxview', view); render(); };
  upInput.onchange = () => { const f = [...upInput.files]; upInput.value = ''; uploadFiles(f); };
  srch.oninput = () => { q = srch.value.trim(); sel.clear(); render(); };
  root.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { srch.value = ''; q = ''; render(); root.focus(); } return; }
    if (e.key === 'Delete' && sel.size) act('del');
    else if (e.key === 'F2' && sel.size === 1) { e.preventDefault(); act('ren'); }
    else if (e.key === 'Enter' && sel.size === 1) act('open');
    else if (e.key === 'Backspace') { e.preventDefault(); if (cur) go(parent()); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); sel = new Set(visible().map(i => i.name)); paintSel(); }
    else if (e.key === 'Escape') { sel.clear(); paintSel(); }
  });

  /* ---- kéo thả: tải lên từ máy và di chuyển giữa các thư mục ---- */
  let dz = null;
  const clearDz = () => { if (dz) { dz.classList.remove('dz'); dz = null; } };
  root.addEventListener('dragstart', e => {
    const r = e.target.closest('[data-n]'); if (!r) return;
    if (!sel.has(r.dataset.n)) { sel = new Set([r.dataset.n]); paintSel(); }
    e.dataTransfer.setData('text/gn', JSON.stringify([...sel])); e.dataTransfer.effectAllowed = 'move';
  });
  root.addEventListener('dragover', e => {
    const t = e.target.closest('[data-drop]'), types = [...e.dataTransfer.types];
    if (!t || !(types.includes('Files') || types.includes('text/gn'))) return;
    e.preventDefault(); e.dataTransfer.dropEffect = types.includes('text/gn') ? 'move' : 'copy';
    const hl = t === main ? null : t;
    if (dz !== hl) { clearDz(); if (hl) { hl.classList.add('dz'); dz = hl; } }
  });
  root.addEventListener('dragleave', e => { if (!root.contains(e.relatedTarget)) clearDz(); });
  root.addEventListener('dragend', clearDz);
  root.addEventListener('drop', e => {
    const t = e.target.closest('[data-drop]'); if (!t) return;
    e.preventDefault(); clearDz();
    const dest = t === main ? cur : t.dataset.drop, internal = e.dataTransfer.getData('text/gn');
    if (internal) moveItems(JSON.parse(internal), dest);
    else if (e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files], user.id + '/' + dest);
  });

  load(true);
}

/* ---- APP 2: BẢNG TIN LỚP ---- */
const KINDS = { tb: ['📢', 'Thông báo'], tkb: ['🗓️', 'Thời khóa biểu'], kt: ['📝', 'Lịch kiểm tra'] };
const dueTxt = d => {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00'), days = Math.round((dt - new Date(new Date().toDateString())) / 864e5);
  return `⏰ ${dt.toLocaleDateString('vi-VN')} · ${days < 0 ? 'đã qua' : days === 0 ? 'hôm nay' : 'còn ' + days + ' ngày'}`;
};
function boardApp(el) {
  el.innerHTML = `<div class="tabs" id="bt"><button class="on" data-k="">Tất cả</button>${Object.entries(KINDS).map(([k, v]) => `<button data-k="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>${isAdm ? '<button class="btn" id="btnPost" style="margin:0 0 10px">+ Đăng bài mới</button>' : ''}<div id="bl"></div>`;
  const bl = el.querySelector('#bl'), tabs = el.querySelectorAll('#bt button');
  let kind = '', all = [];
  const render = () => {
    const l = all.filter(b => !kind || (b.kind || 'tb') === kind);
    bl.innerHTML = l.map(b => {
      const kd = KINDS[b.kind || 'tb'] || KINDS.tb;
      return `<div class="prod bp"><span class="bk">${kd[0]} ${esc(kd[1])}</span><br><b style="color:#4b3ac8">${esc(b.title)}</b>
      <div style="margin:4px 0;white-space:pre-wrap">${esc(b.content)}</div>
      ${b.due ? `<div class="due">${esc(dueTxt(b.due))}</div>` : ''}
      <small class="small">${new Date(b.created_at).toLocaleString('vi-VN')} - Bởi ${esc(b.author)}</small>
      ${isAdm ? `<div><button class="del" data-id="${esc(b.id)}">Xóa</button></div>` : ''}</div>`;
    }).join('') || '<p class="small">Chưa có bài nào.</p>';
  };
  async function load() {
    const { data, error } = await sb.from('board').select('*').order('created_at', { ascending: false });
    if (error) { bl.innerHTML = '<p class="small">Lỗi tải: ' + esc(error.message) + '</p>'; return; }
    all = data || []; render();
  }
  tabs.forEach(b => b.onclick = () => { tabs.forEach(x => x.className = ''); b.className = 'on'; kind = b.dataset.k; render(); });
  bl.onclick = async e => {
    const b = e.target.closest('.del'); if (!b || !confirm('Xóa bài này?')) return;
    const { error } = await sb.from('board').delete().eq('id', b.dataset.id);
    if (error) toast('Không xóa được: ' + error.message, true);
    load();
  };
  if (isAdm) {
    el.querySelector('#btnPost').onclick = async () => {
      const v = await ask('Đăng bài lên bảng tin', [
        { name: 'kind', label: 'Loại', type: 'select', options: Object.entries(KINDS).map(([k, x]) => [k, x[0] + ' ' + x[1]]) },
        { name: 'title', label: 'Tiêu đề', req: 1 },
        { name: 'content', label: 'Nội dung / thời khóa biểu', type: 'textarea', req: 1 },
        { name: 'due', label: 'Ngày (dành cho lịch kiểm tra, không bắt buộc)', type: 'date' }], 'Đăng');
      if (!v) return;
      const row = { title: v.title.trim(), content: v.content.trim(), author: me?.name || user.email, kind: v.kind };
      if (v.due) row.due = v.due;
      const { error } = await sb.from('board').insert(row);
      if (error) return toast('Lỗi: ' + error.message, true);
      toast('Đã đăng bài.'); load();
    };
  }
  load();
}

/* ---- APP 3: TIN NHẮN LỚP ---- */
function chatApp(el) {
  if (!me) { el.innerHTML = '<p class="small">Vào Cài đặt, đặt tên và chọn tổ trước.</p>'; return; }
  const rooms = [['all', 'Cả lớp']]; if (me.team) rooms.push(['t' + me.team, 'Tổ ' + me.team]);
  el.style.display = 'flex'; el.style.flexDirection = 'column';
  el.innerHTML = `<div class="tabs"></div><div class="msgs"></div><div class="cin"><button class="ib" title="Gửi ảnh">📷</button><input type="file" accept="image/*" hidden><input type="text" placeholder="Nhập tin nhắn..." maxlength="500"><button class="btn" style="width:auto;margin:0">Gửi</button></div>`;
  const rs = el.querySelector('.tabs'), ms = el.querySelector('.msgs'), mi = el.querySelector('input[type=text]'), fi = el.querySelector('input[type=file]');
  let room, ch, seen = new Set();
  const add = m => {
    if (m.id != null) { if (seen.has(m.id)) return; seen.add(m.id); }
    const mine = m.user_id === user.id, p = prof.get(m.user_id);
    const row = document.createElement('div'); row.className = 'mrow' + (mine ? ' me' : '');
    if (!mine) row.insertAdjacentHTML('beforeend', avatar(m.name, p?.avatar, 28));
    const d = document.createElement('div'); d.className = 'msg' + (mine ? ' me' : '');
    if (!mine) { const s = document.createElement('small'); s.textContent = m.name; d.append(s); }
    if (m.image) {
      const im = document.createElement('img'); im.className = 'mimg'; im.alt = ''; im.loading = 'lazy'; im.src = m.image;
      im.onclick = () => lightbox(m.image); im.onload = () => { ms.scrollTop = ms.scrollHeight; }; d.append(im);
    }
    if (m.body) { const t = document.createElement('div'); t.textContent = m.body; d.append(t); }
    row.append(d); ms.appendChild(row); ms.scrollTop = ms.scrollHeight;
  };
  async function go(r) {
    room = r; ms.innerHTML = ''; seen = new Set();
    if (ch) { sb.removeChannel(ch); ch = null; }
    [...rs.children].forEach(b => b.className = b.dataset.r === r ? 'on' : '');
    await loadProfMap();
    const { data } = await sb.from('messages').select('*').eq('room', r).order('created_at', { ascending: false }).limit(100);
    if (room !== r) return;
    if (data) data.reverse().forEach(add);
    ch = sb.channel('chat:' + r).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + r }, p => add(p.new)).subscribe();

  fi.onchange = async () => {
    const f = fi.files[0]; fi.value = ''; if (!f) return;
    if (!f.type.startsWith('image/')) return toast('Hãy chọn một tệp ảnh.', true);

    catch (e) { toast('Không gửi được ảnh: ' + e.message, true); }
  };
  go(rooms[0][0]);
  return { off: () => { if (ch) sb.removeChannel(ch); } };
}

/* ---- APP 7: VÒNG QUAY ---- */
function wheelApp(el) {
  el.innerHTML = `<canvas width="280" height="280"></canvas><textarea rows="4" style="margin-top:10px">Bạn A\nBạn B\nBạn C\nBạn D</textarea>
   <div class="row"><input type="checkbox" id="rm"><label for="rm" style="font-weight:400">Loại bỏ người đã trúng khỏi danh sách</label></div>
   <button class="btn">Quay</button><p class="small" style="text-align:center;margin-top:8px"></p>`;
  const c = el.querySelector('canvas'), x = c.getContext('2d'), ta = el.querySelector('textarea'), out = el.querySelector('p'), rm = el.querySelector('#rm');
  let rot = 0, busy = false;
  const items = () => ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  function draw() {
    const l = items(), n = l.length || 1, a = 2 * Math.PI / n;
    x.clearRect(0, 0, 280, 280);
    l.forEach((s, i) => {
      x.beginPath(); x.moveTo(140, 140); x.arc(140, 140, 128, rot + i * a, rot + (i + 1) * a); x.fillStyle = `hsl(${i * 360 / n},70%,60%)`; x.fill();
      x.save(); x.translate(140, 140); x.rotate(rot + (i + .5) * a); x.fillStyle = '#111'; x.font = '14px system-ui'; x.textAlign = 'right'; x.fillText(s.slice(0, 14), 118, 5); x.restore();
    });
    x.fillStyle = '#e74c3c'; x.beginPath(); x.moveTo(140, 18); x.lineTo(130, 0); x.lineTo(150, 0); x.fill();
  }
  ta.oninput = () => { if (!busy) draw(); };
  el.querySelector('.btn').onclick = () => {
    const l = items();
    if (busy) return;
    if (l.length < 2) { out.textContent = 'Cần ít nhất 2 mục để quay.'; return; }
    busy = true; ta.disabled = true; out.textContent = '';
    const start = rot, total = 2 * Math.PI * (5 + Math.random() * 3) + Math.random() * 2 * Math.PI, t0 = performance.now(), D = 4000;
    (function step(t) {
      const p = Math.min(1, (t - t0) / D); rot = start + total * (1 - Math.pow(1 - p, 3)); draw();
      if (p < 1) return requestAnimationFrame(step);
      const a = 2 * Math.PI / l.length, ang = ((1.5 * Math.PI - rot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const idx = Math.min(l.length - 1, Math.floor(ang / a));
      out.innerHTML = '🎉 Kết quả: <b>' + esc(l[idx]) + '</b>';
      if (rm.checked) { ta.value = l.filter((_, i) => i !== idx).join('\n'); draw(); }
      busy = false; ta.disabled = false;
    })(t0);
  };
  draw();
}

/* ---- APP: MÁY TÍNH ---- */
function calcApp(el) {
  const K = ['C', '⌫', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '±', '0', '.', '='];
  const cls = k => k === '=' ? 'eq' : '+−×÷'.includes(k) ? 'op' : 'C⌫%±'.includes(k) ? 'fn' : '';
  el.innerHTML = `<div class="calc"><div class="cd"><small id="ce"></small><div id="cv">0</div></div><div class="ck">${K.map(k => `<button data-k="${k}" class="${cls(k)}">${k}</button>`).join('')}</div></div>`;
  const cv = el.querySelector('#cv'), ce = el.querySelector('#ce');
  let cur = '0', acc = null, op = null, fresh = true, ex = '';
  const num = () => parseFloat(cur);
  const fmtN = n => !isFinite(n) ? 'Lỗi' : String(+n.toPrecision(12));
  const calc = (a, o, b) => o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : o === '÷' ? (b === 0 ? NaN : a / b) : b;
  function press(k) {
    if (cur === 'Lỗi' && k !== 'C') return;
    if (/^\d$/.test(k)) { if (fresh || cur === '0') { cur = k; fresh = false; } else if (cur.replace(/[-.]/g, '').length < 14) cur += k; }
    else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
    else if (k === 'C') { cur = '0'; acc = null; op = null; fresh = true; ex = ''; }
    else if (k === '⌫') { if (!fresh) { cur = cur.slice(0, -1); if (cur === '' || cur === '-') cur = '0'; } }
    else if (k === '±') { if (cur !== '0') cur = cur[0] === '-' ? cur.slice(1) : '-' + cur; }
    else if (k === '%') { cur = fmtN(num() / 100); fresh = true; }
    else if ('+−×÷'.includes(k)) {
      if (op && !fresh) { acc = calc(acc, op, num()); cur = fmtN(acc); } else acc = num();
      op = k; fresh = true; ex = fmtN(acc) + ' ' + k;
    }
    else if (k === '=') { if (op) { const r = calc(acc, op, num()); ex = fmtN(acc) + ' ' + op + ' ' + cur + ' ='; cur = fmtN(r); acc = null; op = null; fresh = true; } }
    cv.textContent = cur; ce.textContent = ex;
    cv.style.fontSize = cur.length > 11 ? '1.4rem' : cur.length > 8 ? '1.8rem' : '2.2rem';
  }
  el.querySelector('.ck').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };
  const kd = e => {
    if (!winActive('calc') || e.ctrlKey || e.metaKey) return;
    const m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '⌫', Escape: 'C', Delete: 'C', ',': '.' }[e.key] || e.key;
    if (K.includes(m)) { e.preventDefault(); press(m); }
  };
  addEventListener('keydown', kd);
  return { off: () => removeEventListener('keydown', kd) };
}

/* ---- APP: TRÒ CHƠI ---- */
function gameApp(el) {
  const G = { snake: ['🐍 Rắn', snakeGame], g2048: ['🔢 2048', g2048Game], mem: ['🃏 Lật hình', memGame] };
  el.innerHTML = `<div class="tabs">${Object.entries(G).map(([k, v]) => `<button data-g="${k}">${v[0]}</button>`).join('')}</div><div class="gbox" id="gb" style="text-align:center"></div>`;
  const box = el.querySelector('#gb'), tabs = el.querySelectorAll('.tabs button');
  let stop = null;
  function start(k) {
    if (stop) { try { stop(); } catch (e) {} stop = null; }
    tabs.forEach(b => b.className = b.dataset.g === k ? 'on' : '');
    box.innerHTML = ''; lsSet('lastgame', k);
    stop = G[k][1](box);
  }
  tabs.forEach(b => b.onclick = () => start(b.dataset.g));
  start(G[lsGet('lastgame', 'snake')] ? lsGet('lastgame', 'snake') : 'snake');
  return { off: () => { if (stop) stop(); } };
}
function snakeGame(box) {
  const N = 14, C = 20;
  box.innerHTML = `<div class="gm-top"><span>Điểm: <b id="sc">0</b></span><span>Kỷ lục: <b id="hi">0</b></span></div><canvas width="${N * C}" height="${N * C}" style="border-radius:10px;background:#f4f5f9;touch-action:none"></canvas><div class="dpad"><button data-d="u">▲</button><div><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div></div><button class="btn" id="rs">Chơi lại</button>`;
  const cv = box.querySelector('canvas'), g = cv.getContext('2d'), sc = box.querySelector('#sc'), hiEl = box.querySelector('#hi');
  const V = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }, OPP = { u: 'd', d: 'u', l: 'r', r: 'l' };
  let snake, dir, nd, food, score, hi = +lsGet('snakehi', 0), timer, over, started;
  hiEl.textContent = hi;
  function place() { do food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)]; while (snake.some(s => s[0] === food[0] && s[1] === food[1])); }
  function reset() { snake = [[7, 7], [6, 7], [5, 7]]; dir = nd = 'r'; score = 0; over = false; started = false; sc.textContent = 0; place(); clearInterval(timer); draw(); }
  function begin() { if (!started && !over) { started = true; timer = setInterval(step, 120); } }
  function turn(d) { begin(); if (d !== OPP[dir]) nd = d; }
  function step() {
    dir = nd; const h = [snake[0][0] + V[dir][0], snake[0][1] + V[dir][1]];
    if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snake.some(s => s[0] === h[0] && s[1] === h[1])) { over = true; clearInterval(timer); draw(); return; }
    snake.unshift(h);
    if (h[0] === food[0] && h[1] === food[1]) { score++; sc.textContent = score; if (score > hi) { hi = score; hiEl.textContent = hi; lsSet('snakehi', hi); } place(); } else snake.pop();
    draw();
  }
  function draw() {
    g.clearRect(0, 0, N * C, N * C);
    g.fillStyle = '#e74c3c'; g.beginPath(); g.arc(food[0] * C + C / 2, food[1] * C + C / 2, C / 2 - 2, 0, 7); g.fill();
    snake.forEach((s, i) => { g.fillStyle = i ? '#4b3ac8' : '#2d1f8f'; g.beginPath(); g.roundRect(s[0] * C + 1, s[1] * C + 1, C - 2, C - 2, 5); g.fill(); });
    if (!started && !over) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, N * C, N * C); g.fillStyle = '#fff'; g.font = 'bold 17px system-ui'; g.textAlign = 'center'; g.fillText('Bấm mũi tên để bắt đầu', N * C / 2, N * C / 2); }
    if (over) { g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, N * C, N * C); g.fillStyle = '#fff'; g.font = 'bold 24px system-ui'; g.textAlign = 'center'; g.fillText('Thua rồi! ' + score + ' điểm', N * C / 2, N * C / 2); }
  }
  const MAP = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r' };
  const kd = e => { if (!winActive('game')) return; const m = MAP[e.key] || MAP[(e.key || '').toLowerCase()]; if (m) { e.preventDefault(); turn(m); } };
  addEventListener('keydown', kd);
  box.querySelector('.dpad').onclick = e => { const b = e.target.closest('button'); if (b) turn(b.dataset.d); };
  box.querySelector('#rs').onclick = reset;
  let t0 = null;
  cv.addEventListener('touchstart', e => { t0 = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
  cv.addEventListener('touchend', e => {
    if (!t0) return; const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1]; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  });
  reset();
  return () => { clearInterval(timer); removeEventListener('keydown', kd); };
}
function g2048Game(box) {
  box.innerHTML = `<div class="gm-top"><span>Điểm: <b id="sc">0</b></span><span>Kỷ lục: <b id="hi">0</b></span></div><div class="g48"></div><p class="small" id="gm" style="margin:8px 0;min-height:1.3em"></p><button class="btn" id="rs">Chơi lại</button><p class="small">Dùng phím mũi tên hoặc vuốt trên bảng.</p>`;
  const bd = box.querySelector('.g48'), sc = box.querySelector('#sc'), hiEl = box.querySelector('#hi'), gm = box.querySelector('#gm');
  const COL = { 0: '#cdc1b4', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  let grid, score, best = +lsGet('best2048', 0), done = false;
  hiEl.textContent = best;
  const empty = () => { const l = []; grid.forEach((r, i) => r.forEach((v, j) => { if (!v) l.push([i, j]); })); return l; };
  function addTile() { const e = empty(); if (!e.length) return; const [i, j] = e[Math.floor(Math.random() * e.length)]; grid[i][j] = Math.random() < .9 ? 2 : 4; }
  function render() {
    bd.innerHTML = grid.flat().map(v => `<div style="background:${COL[v] || '#3c3a32'};color:${v <= 4 ? '#776e65' : '#fff'};font-size:${v >= 1024 ? '1.1rem' : v >= 128 ? '1.3rem' : '1.6rem'}">${v || ''}</div>`).join('');
    sc.textContent = score;
  }
  function reset() { grid = [0, 1, 2, 3].map(() => [0, 0, 0, 0]); score = 0; done = false; gm.textContent = ''; addTile(); addTile(); render(); }
  const slide = row => { const a = row.filter(Boolean); let s = 0; for (let i = 0; i < a.length - 1; i++) { if (a[i] === a[i + 1]) { a[i] *= 2; s += a[i]; a.splice(i + 1, 1); } } while (a.length < 4) a.push(0); return [a, s]; };
  function move(dir) {   // 0 trái, 1 lên, 2 phải, 3 xuống
    if (done) return;
    const g = grid.map(r => r.slice()); let gain = 0;
    for (let i = 0; i < 4; i++) {
      const line = [0, 1, 2, 3].map(j => dir === 0 ? g[i][j] : dir === 2 ? g[i][3 - j] : dir === 1 ? g[j][i] : g[3 - j][i]);
      const [res, s] = slide(line); gain += s;
      res.forEach((v, j) => { if (dir === 0) g[i][j] = v; else if (dir === 2) g[i][3 - j] = v; else if (dir === 1) g[j][i] = v; else g[3 - j][i] = v; });
    }
    if (JSON.stringify(g) === JSON.stringify(grid)) return;
    grid = g; score += gain; addTile();
    if (score > best) { best = score; hiEl.textContent = best; lsSet('best2048', best); }
    render();
    if (grid.flat().includes(2048)) gm.textContent = '🎉 Bạn đã đạt 2048! Cứ chơi tiếp nhé.';
    if (!empty().length && !grid.some((r, i) => r.some((v, j) => v === (r[j + 1] ?? -1) || v === (grid[i + 1]?.[j] ?? -1)))) { done = true; gm.textContent = 'Hết nước đi rồi! Bấm Chơi lại.'; }
  }
  const MAP = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3, a: 0, w: 1, d: 2, s: 3 };
  const kd = e => { if (!winActive('game')) return; const m = MAP[e.key] ?? MAP[(e.key || '').toLowerCase()]; if (m !== undefined) { e.preventDefault(); move(m); } };
  addEventListener('keydown', kd);
  let t0 = null;
  bd.addEventListener('touchstart', e => { t0 = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
  bd.addEventListener('touchend', e => {
    if (!t0) return; const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1]; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  });
  box.querySelector('#rs').onclick = reset;
  reset();
  return () => removeEventListener('keydown', kd);
}
function memGame(box) {
  const E = ['🐶', '🐱', '🦊', '🐼', '🐸', '🦁', '🐵', '🐙'];
  box.innerHTML = `<div class="gm-top"><span>Lượt: <b id="mv">0</b></span><span>Tốt nhất: <b id="bs">-</b></span></div><div class="mem"></div><p class="small" id="gm" style="margin:8px 0;min-height:1.3em"></p><button class="btn" id="rs">Chơi lại</button>`;
  const bd = box.querySelector('.mem'), mv = box.querySelector('#mv'), bs = box.querySelector('#bs'), gm = box.querySelector('#gm');
  let deck, open, moves, matched, lock, tmo;
  const best = () => +lsGet('membest', 0);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function reset() {
    clearTimeout(tmo); deck = shuffle([...E, ...E]); open = []; moves = 0; matched = new Set(); lock = false; gm.textContent = ''; mv.textContent = 0; bs.textContent = best() || '-';
    bd.innerHTML = deck.map((_, i) => `<button data-i="${i}">?</button>`).join('');
  }
  bd.onclick = e => {
    const b = e.target.closest('button'); if (!b || lock) return;
    const i = +b.dataset.i; if (open.includes(i) || matched.has(i)) return;
    b.textContent = deck[i]; b.className = 'up'; open.push(i);
    if (open.length < 2) return;
    moves++; mv.textContent = moves;
    const [a, c] = open;
    if (deck[a] === deck[c]) {
      matched.add(a); matched.add(c); open = [];
      bd.children[a].className = 'ok'; bd.children[c].className = 'ok';
      if (matched.size === deck.length) {
        gm.textContent = `🎉 Hoàn thành trong ${moves} lượt!`;
        if (!best() || moves < best()) { lsSet('membest', moves); bs.textContent = moves; }
      }
    } else {
      lock = true;
      tmo = setTimeout(() => { [a, c].forEach(k => { bd.children[k].textContent = '?'; bd.children[k].className = ''; }); open = []; lock = false; }, 700);
    }
  };
  box.querySelector('#rs').onclick = reset;
  reset();
  return () => clearTimeout(tmo);
}

/* ---- APP GOOGLE: dạng cửa sổ (nhúng) hoặc cửa sổ riêng ---- */
const mkFrame = (box, src) => {
  box.innerHTML = '';
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation');
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = src; box.append(f);
};
function shell(el, { ph, val, btn = 'Mở', extra = '' }) {
  el.style.cssText += ';padding:0;display:flex;flex-direction:column;overflow:hidden';
  el.innerHTML = `<div class="emb"><form class="tb"><input placeholder="${esc(ph)}" value="${esc(val || '')}" style="margin:0;flex:1;min-width:130px"><button class="btn" style="width:auto;margin:0">${esc(btn)}</button>${extra}</form><div class="eb"></div></div>`;
  return { form: el.querySelector('form'), inp: el.querySelector('input'), box: el.querySelector('.eb'), x: [...el.querySelectorAll('form .x')] };
}
const XBTN = t => `<button type="button" class="btn alt x" style="width:auto;margin:0">${t}</button>`;

   <p class="small" style="margin-top:8px">Google không cho hiển thị trực tiếp trong khung, nên các trang bên dưới sẽ mở trong một cửa sổ riêng. Maps, YouTube, Tài liệu và Lịch có app riêng chạy ngay trong GNwebOS.</p>
   <div class="ggrid">${S.map(([n, u, c, i]) => `<button class="gtile" data-u="${esc(u)}"><span class="gi" style="background:${c}">${esc(i)}</span>${esc(n)}</button>`).join('')}</div>`;

function ytEmbed(str) {
  str = str.trim(); if (!str) return null;
  const E = 'https://www.youtube-nocookie.com/embed/';
  if (/^[\w-]{11}$/.test(str)) return E + str;
  try {
    const u = new URL(/^https?:\/\//i.test(str) ? str : 'https://' + str), h = u.hostname.replace(/^(www|m)\./, '');
    const list = u.searchParams.get('list'), v = u.searchParams.get('v'), p = u.pathname.split('/').filter(Boolean);
    if (h === 'youtu.be' && p[0]) return E + p[0] + (list ? '?list=' + encodeURIComponent(list) : '');
    if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
      if (v) return E + encodeURIComponent(v) + (list ? '?list=' + encodeURIComponent(list) : '');
      if (['shorts', 'embed', 'live'].includes(p[0]) && p[1]) return E + p[1];
      if (list) return E + 'videoseries?list=' + encodeURIComponent(list);
    }
  } catch (e) {}
  return null;
}
function youtubeApp(el) {
  const s = shell(el, { ph: 'Dán link video hoặc playlist YouTube...', val: lsGet('ytlast', ''), btn: 'Phát', extra: XBTN('🔍 Tìm trên YouTube') });
  const go = () => {
    const v = s.inp.value.trim(); if (!v) return;
    const src = ytEmbed(v);
    if (!src) return toast('Link YouTube chưa đúng. Hãy dán link video hoặc playlist.', true);
    lsSet('ytlast', v); mkFrame(s.box, src);
  };
  s.form.onsubmit = e => { e.preventDefault(); go(); };
  s.x[0].onclick = () => popup('https://www.youtube.com/results?search_query=' + encodeURIComponent(s.inp.value.trim()));
  s.box.innerHTML = '<div class="ph">▶️<br>Dán link video hoặc playlist YouTube rồi bấm <b>Phát</b> để xem ngay trong cửa sổ.<br>YouTube không cho nhúng ô tìm kiếm, nên nút “Tìm trên YouTube” sẽ mở cửa sổ riêng.</div>';
  if (s.inp.value) go();
}

function gEmbed(str) {
  let u; try { u = new URL(str.trim()); } catch (e) { return null; }
  const h = u.hostname, p = u.pathname; let m;
  if (h === 'docs.google.com') {
    if ((m = p.match(/^\/(document|spreadsheets|presentation)\/d\/(e\/)?([\w-]+)/))) {
      const [, t, e, id] = m;
      if (e) return `https://docs.google.com/${t}/d/e/${id}/` + (t === 'spreadsheets' ? 'pubhtml?widget=true&headers=false' : t === 'presentation' ? 'embed?start=false&loop=false' : 'pub?embedded=true');
      return `https://docs.google.com/${t}/d/${id}/preview`;
    }
    if ((m = p.match(/^\/forms\/d\/e\/([\w-]+)/))) return `https://docs.google.com/forms/d/e/${m[1]}/viewform?embedded=true`;
  }
  if (h === 'drive.google.com') {
    if ((m = p.match(/\/folders\/([\w-]+)/))) return `https://drive.google.com/embeddedfolderview?id=${m[1]}#list`;
    if ((m = p.match(/\/file\/d\/([\w-]+)/))) return `https://drive.google.com/file/d/${m[1]}/preview`;
    const id = u.searchParams.get('id'); if (id) return `https://drive.google.com/file/d/${id}/preview`;
  }
  return null;
}
function gdocsApp(el) {
  const s = shell(el, { ph: 'Dán link Docs, Sheets, Slides, Forms hoặc thư mục Drive...', val: '', btn: 'Mở', extra: XBTN('☆ Lưu') + XBTN('↗') });
  s.box.insertAdjacentHTML('beforebegin', '<div class="chips"></div>');
  const chips = el.querySelector('.chips');
  let saved = []; try { saved = JSON.parse(lsGet('gdl', '[]')); } catch (e) {}
  const paint = () => { chips.innerHTML = saved.map((x, i) => `<button class="chip" data-i="${i}">${esc(x.n)} <i data-x="${i}" title="Xóa">✕</i></button>`).join(''); };
  const open = u => {
    const src = gEmbed(u);
    if (!src) return toast('Chưa nhận ra link. Hãy dán link Google Docs/Sheets/Slides/Forms/Drive.', true);
    s.inp.value = u; mkFrame(s.box, src);
  };
  s.form.onsubmit = e => { e.preventDefault(); if (s.inp.value.trim()) open(s.inp.value.trim()); };
  s.x[0].onclick = async () => {
    const u = s.inp.value.trim(); if (!gEmbed(u)) return toast('Hãy mở một link hợp lệ trước khi lưu.', true);
    const v = await ask('Lưu liên kết', [{ name: 'n', label: 'Tên gợi nhớ', value: 'Tài liệu ' + (saved.length + 1), req: 1 }]);
    if (!v) return;
    saved.push({ n: v.n.trim(), u }); lsSet('gdl', JSON.stringify(saved)); paint();
  };
  s.x[1].onclick = () => { const u = s.inp.value.trim(); if (/^https?:\/\//i.test(u)) popup(u); else toast('Chưa có link để mở.', true); };
  chips.onclick = e => {
    const x = e.target.closest('[data-x]');
    if (x) { e.stopPropagation(); saved.splice(+x.dataset.x, 1); lsSet('gdl', JSON.stringify(saved)); paint(); return; }
    const c = e.target.closest('.chip'); if (c) open(saved[+c.dataset.i].u);
  };
  s.box.innerHTML = '<div class="ph">📄<br>Dán link Google Docs, Sheets, Slides, Forms hoặc thư mục Drive để xem ngay trong cửa sổ.<br><small>Tệp cần đặt chế độ “Bất kỳ ai có đường liên kết đều xem được”. Bấm ☆ Lưu để ghim link vào thanh phía trên.</small></div>';
  paint();
}

function calSrc(s) {
  s = s.trim(); if (!s) return null;
  try {
    const u = new URL(s), src = u.searchParams.get('src'); if (src) return src;
    const cid = u.searchParams.get('cid'); if (cid) { try { return atob(cid); } catch (e) { return cid; } }
  } catch (e) {}
  return s;
}
