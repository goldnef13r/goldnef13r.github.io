<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNwebOS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar and animations */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .window-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dock-glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden select-none bg-cover bg-center font-sans text-slate-100" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop');">

    <!-- Desktop Area -->
    <div id="desktop" class="relative h-[calc(100vh-4rem)] w-full p-4 grid grid-cols-12 gap-4">
        
        <!-- Desktop Shortcuts -->
        <div class="col-span-1 flex flex-col gap-6 items-center">
            <button onclick="openApp('settings')" class="group flex flex-col items-center gap-1 w-20 p-2 rounded-xl hover:bg-white/10 transition">
                <div class="w-12 h-12 rounded-2xl bg-slate-700/80 flex items-center justify-center text-slate-200 group-hover:scale-105 transition shadow-lg">
                    <i data-lucide="settings" class="w-6 h-6"></i>
                </div>
                <span class="text-xs text-center font-medium drop-shadow-md">Cài đặt</span>
            </button>

            <button onclick="openApp('notes')" class="group flex flex-col items-center gap-1 w-20 p-2 rounded-xl hover:bg-white/10 transition">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/80 flex items-center justify-center text-white group-hover:scale-105 transition shadow-lg">
                    <i data-lucide="file-text" class="w-6 h-6"></i>
                </div>
                <span class="text-xs text-center font-medium drop-shadow-md">Ghi chú</span>
            </button>

            <button onclick="openApp('browser')" class="group flex flex-col items-center gap-1 w-20 p-2 rounded-xl hover:bg-white/10 transition">
                <div class="w-12 h-12 rounded-2xl bg-blue-500/80 flex items-center justify-center text-white group-hover:scale-105 transition shadow-lg">
                    <i data-lucide="globe" class="w-6 h-6"></i>
                </div>
                <span class="text-xs text-center font-medium drop-shadow-md">Trình duyệt</span>
            </button>
        </div>

        <!-- Windows Container -->
        <div id="windows-container" class="absolute inset-0 pointer-events-none">
            
            <!-- Window: Settings -->
            <div id="win-settings" class="pointer-events-auto absolute top-20 left-20 w-[450px] h-[350px] glass rounded-2xl window-shadow flex flex-col hidden overflow-hidden transition-all duration-150">
                <!-- Header -->
                <div class="h-10 bg-slate-800/50 px-4 flex items-center justify-between cursor-move select-none border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i>
                        <span class="text-xs font-semibold text-slate-300">Cài đặt hệ thống</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="closeApp('settings')" class="w-3 h-3 rounded-full bg-rose-500 hover:bg-rose-600 transition"></button>
                    </div>
                </div>
                <!-- Body -->
                <div class="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2">Hình nền Desktop (URL)</label>
                        <input type="text" id="bg-url-input" placeholder="Dán URL hình ảnh..." class="w-full px-3 py-2 bg-slate-900/60 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-xs">
                        <button onclick="changeWallpaper()" class="mt-2 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-medium transition">Áp dụng hình nền</button>
                    </div>
                    <hr class="border-slate-700/50">
                    <div>
                        <span class="block text-xs font-medium text-slate-400 mb-1">Thông tin hệ thống</span>
                        <p class="text-xs text-slate-300">Hệ điều hành: <span class="font-semibold text-blue-400">GNwebOS v1.0</span></p>
                        <p class="text-xs text-slate-300">Trạng thái: <span class="font-semibold text-emerald-400">Hoạt động bình thường</span></p>
                    </div>
                </div>
            </div>

            <!-- Window: Notes -->
            <div id="win-notes" class="pointer-events-auto absolute top-28 left-40 w-[500px] h-[380px] glass rounded-2xl window-shadow flex flex-col hidden overflow-hidden transition-all duration-150">
                <!-- Header -->
                <div class="h-10 bg-slate-800/50 px-4 flex items-center justify-between cursor-move select-none border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-amber-400"></i>
                        <span class="text-xs font-semibold text-slate-300">Ghi chú nhanh</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="closeApp('notes')" class="w-3 h-3 rounded-full bg-rose-500 hover:bg-rose-600 transition"></button>
                    </div>
                </div>
                <!-- Body -->
                <div class="flex-1 p-3 flex flex-col">
                    <textarea id="notes-content" class="w-full flex-1 bg-slate-900/40 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500/50 resize-none" placeholder="Nhập ghi chú của bạn ở đây..."></textarea>
                    <div class="flex justify-between items-center mt-2 text-xs text-slate-400">
                        <span id="notes-status">Tự động lưu...</span>
                        <button onclick="saveNotes()" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition">Lưu ngay</button>
                    </div>
                </div>
            </div>

            <!-- Window: Browser -->
            <div id="win-browser" class="pointer-events-auto absolute top-16 left-32 w-[700px] h-[450px] glass rounded-2xl window-shadow flex flex-col hidden overflow-hidden transition-all duration-150">
                <!-- Header -->
                <div class="h-10 bg-slate-800/50 px-4 flex items-center justify-between cursor-move select-none border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="globe" class="w-4 h-4 text-blue-400"></i>
                        <span class="text-xs font-semibold text-slate-300">Trình duyệt Web</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="closeApp('browser')" class="w-3 h-3 rounded-full bg-rose-500 hover:bg-rose-600 transition"></button>
                    </div>
                </div>
                <!-- Search Bar -->
                <div class="p-2 bg-slate-900/40 flex items-center gap-2 border-b border-white/5">
                    <input type="text" id="browser-url" value="https://wikipedia.org" class="flex-1 px-3 py-1 bg-slate-800/80 border border-slate-700 rounded-lg text-xs focus:outline-none focus:border-blue-500">
                    <button onclick="loadBrowserUrl()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs rounded-lg transition">Mở</button>
                </div>
                <!-- Body -->
                <div class="flex-1 bg-white">
                    <iframe id="browser-frame" src="https://wikipedia.org" class="w-full h-full border-none"></iframe>
                </div>
            </div>

        </div>
    </div>

    <!-- Dock / Taskbar -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 dock-glass px-4 py-2.5 rounded-2xl flex items-center gap-4 shadow-2xl z-50">
        <button onclick="openApp('settings')" class="p-2 hover:bg-white/10 rounded-xl transition group relative">
            <i data-lucide="settings" class="w-6 h-6 text-slate-200 group-hover:scale-110 transition"></i>
            <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none">Cài đặt</span>
        </button>
        <button onclick="openApp('notes')" class="p-2 hover:bg-white/10 rounded-xl transition group relative">
            <i data-lucide="file-text" class="w-6 h-6 text-amber-400 group-hover:scale-110 transition"></i>
            <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none">Ghi chú</span>
        </button>
        <button onclick="openApp('browser')" class="p-2 hover:bg-white/10 rounded-xl transition group relative">
            <i data-lucide="globe" class="w-6 h-6 text-blue-400 group-hover:scale-110 transition"></i>
            <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none">Trình duyệt</span>
        </button>

        <div class="h-6 w-px bg-slate-700"></div>

        <!-- Clock Widget -->
        <div class="text-right px-2">
            <div id="clock-time" class="text-xs font-bold text-slate-200">00:00:00</div>
            <div id="clock-date" class="text-[10px] text-slate-400">01/01/2026</div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Clock Functionality
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();

            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('clock-date').textContent = `${day}/${month}/${year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Window Management
        function openApp(id) {
            const win = document.getElementById(`win-${id}`);
            if (win) {
                win.classList.remove('hidden');
                bringToFront(win);
            }
        }

        function closeApp(id) {
            const win = document.getElementById(`win-${id}`);
            if (win) {
                win.classList.add('hidden');
            }
        }

        let zIndexCounter = 10;
        function bringToFront(win) {
            zIndexCounter++;
            win.style.zIndex = zIndexCounter;
        }

        // Add focus listener on click for windows
        ['settings', 'notes', 'browser'].forEach(id => {
            const win = document.getElementById(`win-${id}`);
            if (win) {
                win.addEventListener('mousedown', () => bringToFront(win));
            }
        });

        // Wallpaper Changer
        function changeWallpaper() {
            const url = document.getElementById('bg-url-input').value.trim();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
            }
        }

        // Browser URL loader
        function loadBrowserUrl() {
            let url = document.getElementById('browser-url').value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            document.getElementById('browser-frame').src = url;
        }

        // Local Notes Storage
        const notesTextarea = document.getElementById('notes-content');
        const notesStatus = document.getElementById('notes-status');

        // Load saved note
        notesTextarea.value = localStorage.getItem('gnwebos_notes') || '';

        function saveNotes() {
            localStorage.setItem('gnwebos_notes', notesTextarea.value);
            notesStatus.textContent = 'Đã lưu!';
            setTimeout(() => {
                notesStatus.textContent = 'Tự động lưu...';
            }, 2000);
        }

        notesTextarea.addEventListener('input', () => {
            localStorage.setItem('gnwebos_notes', notesTextarea.value);
        });
    </script>
</body>
</html>
